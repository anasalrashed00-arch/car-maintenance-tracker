<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة سياراتي - سحابي</title>
    <!-- مكتبات Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #fbbf24; --bg-site: #0b0f1a; --card-bg: #161b2a; --text-main: #f8fafc; --text-muted: #94a3b8; --danger: #f87171; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; background-color: var(--bg-site); color: var(--text-main); direction: rtl; }
        .top-nav { display: flex; background: #111827; padding: 10px 5px; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .nav-item { flex: 1; text-align: center; padding: 12px 5px; cursor: pointer; font-size: 13px; color: var(--text-muted); min-width: 80px; }
        .nav-item.active { color: var(--primary); font-weight: bold; border-bottom: 3px solid var(--primary); }
        .main-content { padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-container { background: var(--card-bg); padding: 25px; border-radius: 20px; border: 1px solid #2d3748; min-height: 450px; }
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-size: 14px; color: var(--primary); font-weight: 600; }
        input, select { padding: 14px; border: 1px solid #334155; border-radius: 12px; background: #0f172a; color: white; font-size: 15px; outline: none; width: 100%; }
        .btn-save { padding: 16px; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; width: 100%; background: var(--primary); color: #0b0f1a; font-size: 16px; margin-bottom: 10px; }
        .btn-delete-car { padding: 12px; border: 1px solid var(--danger); border-radius: 12px; font-weight: 600; cursor: pointer; width: 100%; background: transparent; color: var(--danger); font-size: 14px; }
        .log-item { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 10px; border-right: 4px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .btn-excel { background: #10b981; color: white; margin-bottom: 20px; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .btn-del { background: none; border: 1px solid var(--danger); color: var(--danger); padding: 5px 10px; border-radius: 8px; cursor: pointer; font-size: 12px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: #1a202e; border: 1px solid #2d3748; border-radius: 18px; padding: 15px; display: flex; align-items: center; justify-content: space-between; }
        .stat-value { font-size: 18px; font-weight: 700; }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="nav-item active" onclick="showTab('p1', this)">📄 المركبة</div>
    <div class="nav-item" onclick="showTab('p2', this)">🔧 صيانة</div>
    <div class="nav-item" onclick="showTab('p6', this)">⛽ الوقود</div>
    <div class="nav-item" onclick="showTab('p3', this)">📍 التتبع</div>
    <div class="nav-item" onclick="showTab('p4', this)">📊 إحصائيات</div>
    <div class="nav-item" onclick="showTab('p5', this)">📑 سجل</div>
</nav>

<main class="main-content">
    <div id="loading-msg" style="text-align:center; padding:20px;">جاري جلب البيانات من السحاب...</div>
    <div id="content-area" class="form-container" style="display:none;"></div>
</main>

<script>
    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyC7NtjHZCukPK6o1WUqqyYs8-xpX4ldHNc",
        authDomain: "car-tracker-78f7b.firebaseapp.com",
        databaseURL: "https://car-tracker-78f7b-default-rtdb.firebaseio.com",
        projectId: "car-tracker-78f7b",
        storageBucket: "car-tracker-78f7b.firebasestorage.app",
        messagingSenderId: "7295247933",
        appId: "1:7295247933:web:3e88e9423c39c2edeeac54"
    };

    // تشغيل Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cars = [];
    let activeIdx = 0;

    // جلب البيانات من Firebase فور تشغيل الموقع
    db.ref('garage').on('value', (snapshot) => {
        const data = snapshot.val();
        cars = data ? Object.values(data) : [];
        document.getElementById('loading-msg').style.display = 'none';
        document.getElementById('content-area').style.display = 'block';
        showTab('p1');
    });

    function showTab(tabId, el) {
        if(el) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
        const area = document.getElementById('content-area');
        let car = cars[activeIdx];

        if(tabId === 'p1') {
            area.innerHTML = `
                <h3 style="text-align:center; color:var(--primary)">بيانات المركبة</h3>
                <select id="carSel" onchange="switchCar(this.value)" style="margin-bottom:20px;">
                    ${cars.map((c, i) => `<option value="${i}" ${i==activeIdx?'selected':''}>🚗 ${c.type}</option>`).join('')}
                    <option value="new">+ إضافة مركبة جديدة</option>
                </select>
                <div class="input-group"><label>نوع المركبة</label><input type="text" id="v_type" value="${car?car.type:''}"></div>
                <div class="input-group"><label>الموديل</label><input type="text" id="v_model" value="${car?car.model||'':''}"></div>
                <div class="input-group"><label>سنة الصنع</label><input type="text" id="v_year" value="${car?car.year||'':''}"></div>
                <button class="btn-save" onclick="saveCar()">${car ? 'تحديث البيانات 💾' : 'إضافة مركبة 💾'}</button>
                ${car ? `<button class="btn-delete-car" onclick="deleteCar()">حذف هذه المركبة ❌</button>` : ''}`;
        }
        else if(tabId === 'p2') {
            area.innerHTML = `<h3 style="text-align:center; color:var(--primary)">تسجيل صيانة</h3>
                <div class="input-group"><label>نوع الصيانة</label><input type="text" id="m_t" placeholder="مثلاً: تغيير زيت"></div>
                <div class="input-group"><label>المبلغ (ريال)</label><input type="text" id="m_p"></div>
                <div class="input-group"><label>التاريخ</label><input type="date" id="m_d"></div>
                <button class="btn-save" onclick="addLog('صيانة')">حفظ 🔧</button>`;
            document.getElementById('m_d').valueAsDate = new Date();
        }
        else if(tabId === 'p6') {
            area.innerHTML = `<h3 style="text-align:center; color:var(--primary)">تسجيل الوقود</h3>
                <div class="input-group"><label>بكم عبيت؟ (ريال)</label><input type="text" id="f_p"></div>
                <div class="input-group"><label>التاريخ</label><input type="date" id="f_d"></div>
                <button class="btn-save" onclick="addLog('وقود')">حفظ ⛽</button>`;
            document.getElementById('f_d').valueAsDate = new Date();
        }
        else if(tabId === 'p3') {
            area.innerHTML = `<h3 style="text-align:center; color:var(--primary)">تحديث الممشى</h3>
                <div class="input-group"><label>الممشى الحالي (كم)</label><input type="text" id="odo_val"></div>
                <button class="btn-save" onclick="updateOdo()">تحديث القراءة 📍</button>`;
        }
        else if(tabId === 'p5') {
            if(!car || !car.logs) { area.innerHTML = "<h3 style='text-align:center'>السجل فارغ</h3>"; return; }
            const logsArray = Object.values(car.logs);
            area.innerHTML = `<button class="btn-excel" onclick="exportExcel()">تصدير سجل ${car.type} إلى Excel 📊</button>` + 
                logsArray.slice().reverse().map((l, i) => `
                <div class="log-item">
                    <div><strong>${l.cat}:</strong> ${l.title}</div>
                    <div style="text-align:left"><span style="color:var(--primary)">${l.price} ر</span><br><small>${l.date}</small></div>
                </div>`).join('');
        }
        else if(tabId === 'p4') {
            if(!car) { area.innerHTML = "أضف مركبة أولاً"; return; }
            const logs = car.logs ? Object.values(car.logs) : [];
            const mLogs = logs.filter(l => l.cat === 'صيانة');
            const fLogs = logs.filter(l => l.cat === 'وقود');
            area.innerHTML = `<h3 style="text-align:right; color:var(--primary)">الإحصائيات</h3>
                <div class="stats-grid">
                    <div class="stat-card"><div>صيانات</div><div class="stat-value">${mLogs.length}</div></div>
                    <div class="stat-card"><div>تكاليف</div><div class="stat-value">${mLogs.reduce((a,b)=>a+Number(b.price || 0),0)} ر</div></div>
                    <div class="stat-card"><div>تعبئات</div><div class="stat-value">${fLogs.length}</div></div>
                    <div class="stat-card"><div>الممشى</div><div class="stat-value">${car.lastOdo || '—'}</div></div>
                </div>`;
        }
    }

    function saveCar() {
        const type = document.getElementById('v_type').value;
        if(!type) return alert("سجل النوع");
        const carId = cars[activeIdx] ? cars[activeIdx].id : db.ref('garage').push().key;
        const carData = { 
            id: carId,
            type: type, 
            model: document.getElementById('v_model').value, 
            year: document.getElementById('v_year').value,
            logs: cars[activeIdx] ? (cars[activeIdx].logs || {}) : {},
            lastOdo: cars[activeIdx] ? (cars[activeIdx].lastOdo || '') : ''
        };
        db.ref('garage/' + carId).set(carData).then(() => alert("تم الحفظ في السحاب ☁️"));
    }

    function addLog(cat) {
        if(!cars[activeIdx]) return alert("أضف سيارة أولاً");
        let dateVal = cat === 'وقود' ? document.getElementById('f_d').value : document.getElementById('m_d').value;
        let entry = { 
            cat: cat, 
            date: dateVal || new Date().toLocaleDateString('en-GB'),
            price: cat === 'وقود' ? document.getElementById('f_p').value : document.getElementById('m_p').value,
            title: cat === 'وقود' ? "تعبئة وقود" : document.getElementById('m_t').value
        };
        db.ref('garage/' + cars[activeIdx].id + '/logs').push(entry).then(() => alert("تمت إضافة السجل"));
    }

    function updateOdo() {
        const v = document.getElementById('odo_val').value;
        if(!v || !cars[activeIdx]) return;
        db.ref('garage/' + cars[activeIdx].id + '/lastOdo').set(v + " كم").then(() => alert("تم تحديث الممشى"));
    }

    function deleteCar() {
        if(confirm("حذف السيارة نهائياً من السحاب؟")) {
            db.ref('garage/' + cars[activeIdx].id).remove().then(() => {
                alert("تم الحذف");
                activeIdx = 0;
            });
        }
    }

    function switchCar(v) { if(v === 'new') { activeIdx = cars.length; showTab('p1'); return; } activeIdx = parseInt(v); showTab('p1'); }

    function exportExcel() {
        const logs = cars[activeIdx].logs ? Object.values(cars[activeIdx].logs) : [];
        const data = logs.map(l => ({ "التاريخ": l.date, "النوع": l.cat, "التفاصيل": l.title, "المبلغ": l.price }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Sijill");
        XLSX.writeFile(wb, `سجل_${cars[activeIdx].type}.xlsx`);
    }
</script>
</body>
</html>
