<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة سياراتي - النسخة النهائية</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { 
            --primary: #fbbf24; 
            --bg-site: #0f172a; 
            --card-bg: #1e293b; 
            --text-main: #f8fafc; 
            --text-muted: #94a3b8; 
            --danger: #ef4444; 
            --success: #10b981; 
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { margin: 0; background-color: var(--bg-site); color: var(--text-main); direction: rtl; overflow-x: hidden; }

        #auth-area { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%); }
        .auth-card { background: var(--card-bg); padding: 40px 30px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 400px; text-align: center; }

        .header-bar { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .top-nav { background: var(--card-bg); display: none; position: sticky; top: 0; z-index: 1000; overflow-x: auto; padding: 5px 0; border-bottom: 2px solid var(--primary); scrollbar-width: none; }
        .nav-item { display: inline-flex; flex-direction: column; align-items: center; padding: 10px 15px; cursor: pointer; color: var(--text-muted); font-size: 12px; font-weight: 700; min-width: 75px; transition: 0.3s; }
        .nav-item.active { color: var(--primary); background: rgba(251, 191, 36, 0.1); border-radius: 12px; }

        .main-content { padding: 20px; max-width: 550px; margin: 0 auto; }
        .glass-card { background: var(--card-bg); padding: 25px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.05); }

        .input-group { margin-bottom: 20px; text-align: right; }
        label { display: block; font-size: 13px; color: var(--primary); font-weight: 700; margin-bottom: 8px; }
        
        input, select { 
            width: 100%; height: 55px; padding: 0 15px; 
            border: 2px solid #334155; border-radius: 16px; 
            background: #0f172a; color: white; font-size: 15px; outline: none; 
            appearance: none; -webkit-appearance: none; transition: 0.3s;
        }
        input:focus, select:focus { border-color: var(--primary); background: #1e293b; }

        .select-wrapper { position: relative; }
        .select-wrapper::after {
            content: '▼'; font-size: 10px; color: var(--primary);
            position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
            pointer-events: none;
        }

        .btn { padding: 16px; border: none; border-radius: 18px; font-weight: 800; cursor: pointer; width: 100%; font-size: 16px; transition: 0.3s; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), #d97706); color: #0b0f1a; }
        .btn-excel { background: var(--success); color: white; margin-bottom: 15px; font-size: 14px; }

        .log-item { background: #1e293b; padding: 15px; border-radius: 18px; margin-bottom: 12px; border-right: 5px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        .price-tag { background: rgba(251, 191, 36, 0.15); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-weight: 900; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { background: #0f172a; border-radius: 20px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .stat-value { font-size: 20px; font-weight: 900; color: var(--primary); display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div id="auth-area">
    <div class="auth-card">
        <div style="font-size: 50px;">⚡</div>
        <h2 style="margin:10px 0 5px 0;">مركبتي السحابية</h2>
        <p style="color: var(--text-muted); margin-bottom: 25px;">نظام إدارة ذكي</p>
        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="user_id" placeholder="اسم المستخدم">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="user_pass" placeholder="••••••••">
        </div>
        <button class="btn btn-primary" onclick="handleAuth()">دخول آمن 🔒</button>
    </div>
</div>

<div id="app-area" style="display: none;">
    <div class="header-bar">
        <div id="display-user" style="font-weight: 700; color: var(--primary);"></div>
        <div onclick="logout()" style="color: var(--danger); cursor: pointer; font-size: 14px; font-weight: 700;">خروج 🚪</div>
    </div>
    
    <nav class="top-nav" id="main-nav">
        <div class="nav-item active" onclick="showTab('p1', this)"><span>🚗</span> المركبة</div>
        <div class="nav-item" onclick="showTab('p2', this)"><span>🔧</span> صيانة</div>
        <div class="nav-item" onclick="showTab('p6', this)"><span>⛽</span> وقود</div>
        <div class="nav-item" onclick="showTab('p3', this)"><span>📍</span> العداد</div>
        <div class="nav-item" onclick="showTab('p4', this)"><span>📊</span> تقارير</div>
        <div class="nav-item" onclick="showTab('p5', this)"><span>📑</span> السجل</div>
    </nav>

    <main class="main-content">
        <div id="content-area" class="glass-card"></div>
    </main>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC7NtjHZCukPK6o1WUqqyYs8-xpX4ldHNc",
        authDomain: "car-tracker-78f7b.firebaseapp.com",
        databaseURL: "https://car-tracker-78f7b-default-rtdb.firebaseio.com",
        projectId: "car-tracker-78f7b",
        storageBucket: "car-tracker-78f7b.firebasestorage.app",
        appId: "1:7295247933:web:3e88e9423c39c2edeeac54"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let cars = [];
    let activeIdx = 0;
    let userId = null;

    auth.onAuthStateChanged(user => {
        if (user) {
            userId = user.uid;
            document.getElementById('auth-area').style.display = 'none';
            document.getElementById('app-area').style.display = 'block';
            document.getElementById('main-nav').style.display = 'flex';
            document.getElementById('display-user').innerText = "أهلاً " + user.email.split('@')[0];
            syncData();
        } else {
            document.getElementById('auth-area').style.display = 'flex';
            document.getElementById('app-area').style.display = 'none';
        }
    });

    function handleAuth() {
        const user = document.getElementById('user_id').value.trim().toLowerCase();
        const pass = document.getElementById('user_pass').value;
        if(!user || !pass) return;
        const fakeEmail = user + "@app.com";
        auth.signInWithEmailAndPassword(fakeEmail, pass).catch(() => {
            auth.createUserWithEmailAndPassword(fakeEmail, pass);
        });
    }

    function logout() { auth.signOut(); }

    function syncData() {
        db.ref('users/' + userId + '/garage').on('value', snap => {
            const data = snap.val();
            cars = data ? Object.values(data) : [];
            showTab('p1');
        });
    }

    function showTab(tabId, el) {
        if(el) {
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');
        }
        const area = document.getElementById('content-area');
        let car = cars[activeIdx];

        if(tabId === 'p1') {
            area.innerHTML = `
                <h3 style="text-align:center; margin:0 0 20px 0;">المرآب السحابي</h3>
                <div class="input-group">
                    <label>اختر المركبة</label>
                    <div class="select-wrapper">
                        <select id="carSel" onchange="activeIdx=this.value; showTab('p1')">
                            ${cars.map((c, i) => `<option value="${i}" ${i==activeIdx?'selected':''}>🚗 ${c.type}</option>`).join('')}
                            <option value="new">+ إضافة مركبة جديدة</option>
                        </select>
                    </div>
                </div>
                <div class="input-group"><label>الماركة / الطراز</label><input type="text" id="v_type" value="${car?car.type:''}" placeholder="مثلاً: نيسان التيما"></div>
                <div class="input-group"><label>سنة الصنع</label><input type="text" id="v_model" value="${car?car.model||'':''}" placeholder="مثلاً: 2026"></div>
                <button class="btn btn-primary" onclick="saveCar()">حفظ البيانات ✨</button>
                ${car ? `<button onclick="deleteCar()" style="width:100%; background:none; border:none; color:var(--danger); margin-top:15px; cursor:pointer; font-weight:bold;">× حذف المركبة</button>` : ''}`;
        } else if(tabId === 'p5') {
            area.innerHTML = `<h3>سجل العمليات</h3>
                <button class="btn btn-excel" onclick="exportFilteredExcel()">تصدير Excel 📊</button>
                <div class="input-group">
                    <label>تصفية النتائج</label>
                    <div class="select-wrapper">
                        <select id="sijill_filter" onchange="renderFilteredLogs()">
                            <option value="none" selected>— اختر نوع التصفية —</option>
                            <option value="الكل">كل العمليات</option>
                            <option value="وقود">وقود</option>
                            <option value="زيت المحرك">زيت المحرك</option>
                            <option value="زيت القير">زيت القير</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                </div>
                <div id="logs_container">
                    <div style="text-align:center; padding:40px; color:var(--text-muted);">
                        <div style="font-size:40px; margin-bottom:10px;">🔍</div>
                        <p>بانتظار اختيارك لعرض البيانات</p>
                    </div>
                </div>`;
        } else if(tabId === 'p2') {
            area.innerHTML = `<h3>تسجيل صيانة</h3>
                <div class="input-group">
                    <label>نوع الصيانة</label>
                    <div class="select-wrapper">
                        <select id="m_type_sel" onchange="toggleManualMaint()">
                            <option value="زيت المحرك">زيت المحرك</option>
                            <option value="زيت القير">زيت القير</option>
                            <option value="تغيير كفرات">تغيير كفرات</option>
                            <option value="فلتر مكينة">فلتر مكينة</option>
                            <option value="أخرى">أخرى</option>
                        </select>
                    </div>
                </div>
                <div id="manual_m_group" class="input-group hidden"><label>وصف الصيانة</label><input type="text" id="m_t_manual"></div>
                <div class="input-group"><label>التكلفة (ر.س)</label><input type="number" id="m_p"></div>
                <div class="input-group"><label>التاريخ</label><input type="date" id="m_d"></div>
                <button class="btn btn-primary" onclick="addLog('صيانة')">تأكيد الصيانة 🔨</button>`;
            document.getElementById('m_d').valueAsDate = new Date();
        } else if(tabId === 'p6') {
            area.innerHTML = `<h3>محطة الوقود</h3>
                <div class="input-group"><label>قيمة التعبئة (ر.س)</label><input type="number" id="f_p"></div>
                <div class="input-group"><label>التاريخ</label><input type="date" id="f_d"></div>
                <button class="btn btn-primary" onclick="addLog('وقود')">تسجيل ⛽</button>`;
            document.getElementById('f_d').valueAsDate = new Date();
        } else if(tabId === 'p3') {
            area.innerHTML = `<h3>موقع العداد</h3>
                <div class="input-group"><label>القراءة الحالية (كم)</label><input type="number" id="odo_val" value="${car?parseInt(car.lastOdo):''}"></div>
                <button class="btn btn-primary" onclick="updateOdo()">تحديث الممشى 📍</button>`;
        } else if(tabId === 'p4') {
            if(!car) return;
            const logs = car.logs ? Object.values(car.logs) : [];
            const maint = logs.filter(l => l.cat === 'صيانة').reduce((a,b)=>a+Number(b.price), 0);
            const fuel = logs.filter(l => l.cat === 'وقود').reduce((a,b)=>a+Number(b.price), 0);
            area.innerHTML = `<h3>تقرير: ${car.type}</h3>
                <div class="stats-grid">
                    <div class="stat-card"><span>صيانة</span><span class="stat-value">${maint}</span></div>
                    <div class="stat-card"><span>وقود</span><span class="stat-value">${fuel}</span></div>
                    <div class="stat-card"><span>الممشى</span><span class="stat-value">${car.lastOdo || 0}</span></div>
                    <div class="stat-card"><span>الإجمالي</span><span class="stat-value">${maint + fuel}</span></div>
                </div>`;
        }
    }

    function renderFilteredLogs() {
        const car = cars[activeIdx];
        const container = document.getElementById('logs_container');
        const filterValue = document.getElementById('sijill_filter').value;
        
        if (filterValue === "none") {
            container.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);"><div style="font-size:40px; margin-bottom:10px;">🔍</div><p>بانتظار اختيارك لعرض البيانات</p></div>`;
            return;
        }
        
        if(!car || !car.logs) { container.innerHTML = "<h3 style='text-align:center'>لا توجد سجلات</h3>"; return; }
        
        const logsArr = Object.values(car.logs);
        const filtered = filterValue === "الكل" 
            ? logsArr 
            : logsArr.filter(l => l.title.includes(filterValue) || l.cat.includes(filterValue));
        
        container.innerHTML = filtered.reverse().map(l => `<div class="log-item">
            <div><b>${l.title}</b><br><small style="color:var(--text-muted)">${l.date} | ${l.cat}</small></div>
            <div class="price-tag">${l.price} ر.س</div>
        </div>`).join('');
    }

    function saveCar() {
        const type = document.getElementById('v_type').value;
        if(!type) return;
        const carId = (cars[activeIdx] && cars[activeIdx].id) ? cars[activeIdx].id : db.ref('users/'+userId+'/garage').push().key;
        db.ref('users/' + userId + '/garage/' + carId).update({
            id: carId, type: type, model: document.getElementById('v_model').value,
            lastOdo: cars[activeIdx] ? (cars[activeIdx].lastOdo || '0 كم') : '0 كم'
        }).then(() => alert("تم الحفظ"));
    }

    function addLog(cat) {
        if(!cars[activeIdx]) return;
        let p = (cat === 'وقود' ? document.getElementById('f_p').value : document.getElementById('m_p').value) || 0;
        let t = (cat === 'وقود') ? "تعبئة وقود" : document.getElementById('m_type_sel').value;
        if(t === 'أخرى') t = document.getElementById('m_t_manual').value;
        let d = (cat === 'وقود') ? document.getElementById('f_d').value : document.getElementById('m_d').value;
        db.ref('users/' + userId + '/garage/' + cars[activeIdx].id + '/logs').push({ cat, price: p, title: t, date: d })
        .then(() => { alert("تم التسجيل"); showTab('p5'); });
    }

    function updateOdo() {
        const v = document.getElementById('odo_val').value;
        if(v && cars[activeIdx]) db.ref('users/'+userId+'/garage/'+cars[activeIdx].id).update({ lastOdo: v + " كم" }).then(() => alert("تم التحديث"));
    }

    function exportFilteredExcel() {
        const car = cars[activeIdx];
        const filterValue = document.getElementById('sijill_filter').value;
        if(!car || !car.logs || filterValue === "none") return;
        const logsArr = Object.values(car.logs);
        const filtered = filterValue === "الكل" ? logsArr : logsArr.filter(l => l.title.includes(filterValue));
        const data = filtered.map(l => ({ "التاريخ": l.date, "النوع": l.cat, "التفاصيل": l.title, "المبلغ": l.price }));
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Sijill");
        XLSX.writeFile(wb, `سجل_${car.type}.xlsx`);
    }

    function toggleManualMaint() {
        document.getElementById('manual_m_group').classList.toggle('hidden', document.getElementById('m_type_sel').value !== 'أخرى');
    }
</script>
</body>
</html>
