<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركبتي السحابية</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold:#f59e0b; --gold-light:#fcd34d; --gold-dim:rgba(245,158,11,0.12);
            --bg:#080d16; --surface:#0e1623; --card:#131e30; --card2:#192538;
            --border:rgba(255,255,255,0.07); --border-gold:rgba(245,158,11,0.3);
            --text:#f0f4ff; --muted:#64748b; --muted2:#94a3b8;
            --danger:#f43f5e; --danger-dim:rgba(244,63,94,0.12);
            --success:#10b981; --success-dim:rgba(16,185,129,0.12);
            --blue:#3b82f6; --blue-dim:rgba(59,130,246,0.12);
            --purple:#8b5cf6; --purple-dim:rgba(139,92,246,0.12);
            --bottom-nav-h:68px;
        }
        *{box-sizing:border-box;margin:0;padding:0;font-family:'Cairo',sans-serif;-webkit-tap-highlight-color:transparent}
        input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
        input[type=number]{-moz-appearance:textfield}
        body{background:var(--bg);color:var(--text);direction:rtl;overflow-x:hidden;min-height:100vh;padding-bottom:var(--bottom-nav-h)}
        body::before{content:'';position:fixed;inset:0;z-index:0;
            background-image:linear-gradient(rgba(245,158,11,0.03)1px,transparent 1px),linear-gradient(90deg,rgba(245,158,11,0.03)1px,transparent 1px);
            background-size:40px 40px;pointer-events:none}
 
        /* SPLASH */
        #splash{position:fixed;inset:0;z-index:9999;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;transition:opacity .4s ease}
        #splash.hide{opacity:0;pointer-events:none}
        .splash-logo{width:80px;height:80px;background:linear-gradient(135deg,var(--gold),#d97706);border-radius:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(245,158,11,.3);animation:splashPulse 1.5s ease infinite}
        .splash-logo i{color:#000}
        @keyframes splashPulse{0%,100%{box-shadow:0 0 40px rgba(245,158,11,.3)}50%{box-shadow:0 0 80px rgba(245,158,11,.5)}}
        .splash-title{font-size:24px;font-weight:900;color:var(--gold)}
        .splash-spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
 
        /* AUTH */
        #auth-area{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px;position:relative;z-index:1}
        .auth-glow{position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(245,158,11,.12),transparent 70%);border-radius:50%;pointer-events:none}
        .auth-card{position:relative;z-index:2;background:var(--card);border:1px solid var(--border-gold);border-radius:28px;padding:44px 36px;width:100%;max-width:400px;text-align:center;box-shadow:0 0 60px rgba(245,158,11,.08),0 30px 60px rgba(0,0,0,.4)}
        .auth-icon{width:72px;height:72px;background:linear-gradient(135deg,var(--gold),#d97706);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:20px;box-shadow:0 8px 32px rgba(245,158,11,.35)}
        .auth-icon i{color:#000}
        .auth-title{font-size:22px;font-weight:900;color:var(--text);margin-bottom:6px}
        .auth-sub{font-size:13px;color:var(--muted2);margin-bottom:32px}
 
        /* HEADER */
        .header-bar{background:rgba(13,20,35,.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--border-gold);padding:0 16px;height:58px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;gap:10px}
        .header-brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
        .header-logo{width:34px;height:34px;background:linear-gradient(135deg,var(--gold),#d97706);border-radius:10px;display:flex;align-items:center;justify-content:center}
        .header-logo i{color:#000}
        .header-name{font-size:15px;font-weight:800;color:var(--gold)}
        .header-car-switch{flex:1;display:flex;align-items:center;justify-content:center}
        .car-switch-btn{display:flex;align-items:center;gap:6px;background:var(--gold-dim);border:1px solid var(--border-gold);border-radius:12px;padding:6px 12px;cursor:pointer;transition:.2s;max-width:180px;overflow:hidden}
        .car-switch-btn:hover{background:rgba(245,158,11,.2)}
        .car-switch-name{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .car-switch-btn i{color:var(--gold);flex-shrink:0}
        .logout-btn{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(244,63,94,.2);border-radius:10px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;font-family:'Cairo',sans-serif;display:flex;align-items:center;gap:4px;flex-shrink:0}
        .logout-btn:hover{background:rgba(244,63,94,.2)}
 
        /* SESSION BANNER */
        .session-banner{background:rgba(245,158,11,.08);border-bottom:1px solid var(--border-gold);padding:8px 16px;font-size:12px;font-weight:700;color:var(--gold);text-align:center;display:none;align-items:center;justify-content:center;gap:6px}
 
        /* BOTTOM NAV */
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--bottom-nav-h);background:rgba(13,20,35,.97);backdrop-filter:blur(20px);border-top:1px solid var(--border-gold);display:none;align-items:center;justify-content:space-around;padding:0 2px;z-index:100}
        .nav-item{display:flex;flex-direction:column;align-items:center;padding:6px 8px;border-radius:14px;cursor:pointer;color:var(--muted2);font-size:10px;font-weight:700;min-width:48px;transition:.2s;white-space:nowrap;flex-shrink:0;gap:3px;position:relative}
        .nav-item i{transition:.2s}
        .nav-item.active{color:var(--gold)}
        .nav-item.active::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:3px;background:var(--gold);border-radius:0 0 4px 4px}
        .nav-item:not(.active):hover{color:var(--text)}
 
        /* MAIN */
        #app-area{position:relative;z-index:1}
        .main-content{padding:16px;max-width:540px;margin:0 auto}
 
        /* CARDS */
        .section-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:24px 20px;margin-bottom:16px}
        .section-title{font-size:16px;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);color:var(--text)}
        .section-title i{color:var(--gold)}
 
        /* INPUTS */
        .input-group{margin-bottom:16px}
        label{display:block;font-size:12px;font-weight:700;color:var(--gold);margin-bottom:8px;letter-spacing:.3px}
        input,select{width:100%;height:52px;padding:0 16px;border:1.5px solid var(--border);border-radius:14px;background:var(--surface);color:var(--text);font-size:14px;font-family:'Cairo',sans-serif;outline:none;appearance:none;-webkit-appearance:none;transition:.2s}
        input:focus,select:focus{border-color:var(--gold);background:var(--card2);box-shadow:0 0 0 3px rgba(245,158,11,.08)}
        input::placeholder{color:var(--muted)}
        .select-wrap{position:relative}
        .select-wrap::after{content:'▾';font-size:13px;color:var(--gold);position:absolute;left:16px;top:50%;transform:translateY(-50%);pointer-events:none}
 
        /* BUTTONS */
        .btn{width:100%;height:52px;border:none;border-radius:14px;font-family:'Cairo',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
        .btn:disabled{opacity:.6;cursor:not-allowed;transform:none!important}
        .btn-primary{background:linear-gradient(135deg,var(--gold),#d97706);color:#000;box-shadow:0 4px 20px rgba(245,158,11,.25)}
        .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 6px 28px rgba(245,158,11,.35)}
        .btn-primary:active:not(:disabled){transform:translateY(0)}
        .btn-ghost{background:transparent;border:1.5px solid var(--border);color:var(--muted2)}
        .btn-ghost:hover{border-color:var(--muted2);color:var(--text)}
        .btn-danger-ghost{background:var(--danger-dim);border:1px solid rgba(244,63,94,.2);color:var(--danger)}
        .btn-danger-ghost:hover{background:rgba(244,63,94,.2)}
        .btn-success{background:var(--success-dim);border:1px solid rgba(16,185,129,.2);color:var(--success);margin-bottom:16px}
        .btn-success:hover{background:rgba(16,185,129,.2)}
        .btn-sm{height:38px;font-size:13px;border-radius:10px}
        .btn-spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite}
 
        /* STATS */
        .stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 14px;text-align:center;position:relative;overflow:hidden;transition:.2s}
        .stat-card:hover{border-color:var(--border-gold)}
        .stat-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(245,158,11,.04),transparent)}
        .stat-icon{margin-bottom:6px;display:flex;justify-content:center}
        .stat-icon i{color:var(--gold)}
        .stat-label{font-size:11px;color:var(--muted2);font-weight:600;margin-bottom:6px;display:block}
        .stat-value{font-size:22px;font-weight:900;color:var(--gold);display:block}
        .stat-unit{font-size:11px;color:var(--muted)}
        .stat-card.total{grid-column:span 2}
        .stat-card.total .stat-value{font-size:28px}
 
        /* CHART */
        .chart-wrap{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:20px;margin-top:10px}
        .chart-title{font-size:13px;font-weight:700;color:var(--muted2);margin-bottom:16px}
        .chart-bars{display:flex;align-items:flex-end;gap:6px;height:100px}
        .chart-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
        .chart-bar{width:100%;border-radius:6px 6px 0 0;min-height:4px;transition:height .5s ease}
        .chart-bar.fuel-bar{background:linear-gradient(to top,#1d4ed8,#3b82f6)}
        .chart-bar.maint-bar{background:linear-gradient(to top,#d97706,var(--gold))}
        .chart-label{font-size:9px;color:var(--muted);font-weight:600}
        .chart-legend{display:flex;gap:16px;margin-top:12px;justify-content:center}
        .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted2);font-weight:600}
        .legend-dot{width:10px;height:10px;border-radius:3px}
 
        /* LOG ITEMS */
        .log-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:10px;transition:.2s}
        .log-item:hover{border-color:var(--border-gold)}
        .log-dot{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .log-dot.fuel{background:rgba(59,130,246,.15)} .log-dot.fuel i{color:#3b82f6}
        .log-dot.maint{background:rgba(245,158,11,.12)} .log-dot.maint i{color:var(--gold)}
        .log-dot.fine{background:rgba(244,63,94,.12)} .log-dot.fine i{color:var(--danger)}
        .log-dot.ins{background:rgba(139,92,246,.12)} .log-dot.ins i{color:var(--purple)}
        .log-info{flex:1;min-width:0}
        .log-title{font-size:14px;font-weight:700;color:var(--text)}
        .log-meta{font-size:11px;color:var(--muted2);margin-top:2px}
        .log-price{background:var(--gold-dim);border:1px solid var(--border-gold);color:var(--gold);padding:4px 10px;border-radius:8px;font-size:13px;font-weight:800;flex-shrink:0;white-space:nowrap}
        .log-del,.log-edit{color:var(--muted);cursor:pointer;padding:6px;border-radius:8px;transition:.2s;flex-shrink:0;display:flex;align-items:center}
        .log-del:hover{color:var(--danger);background:var(--danger-dim)}
        .log-edit:hover{color:var(--gold);background:var(--gold-dim)}
 
        /* STATUS BADGE */
        .status-badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;flex-shrink:0;white-space:nowrap}
        .status-paid{background:var(--success-dim);color:var(--success);border:1px solid rgba(16,185,129,.2)}
        .status-pending{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(244,63,94,.2)}
        .status-active{background:var(--success-dim);color:var(--success);border:1px solid rgba(16,185,129,.2)}
        .status-expiring{background:rgba(245,158,11,.15);color:var(--gold);border:1px solid var(--border-gold)}
        .status-expired{background:var(--danger-dim);color:var(--danger);border:1px solid rgba(244,63,94,.2)}
 
        /* LOG TOTAL */
        .log-total{background:var(--gold-dim);border:1px solid var(--border-gold);border-radius:14px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-top:4px}
        .log-total-label{font-size:13px;font-weight:700;color:var(--muted2)}
        .log-total-value{font-size:18px;font-weight:900;color:var(--gold)}
 
        /* INSURANCE CARD */
        .ins-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 16px;margin-bottom:12px;transition:.2s}
        .ins-card:hover{border-color:var(--border-gold)}
        .ins-card-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
        .ins-avatar{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--purple-dim)}
        .ins-avatar i{color:var(--purple)}
        .ins-title{font-size:15px;font-weight:800;color:var(--text)}
        .ins-type{font-size:12px;color:var(--muted2);margin-top:2px}
        .ins-dates{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
        .ins-date-item{background:var(--card);border-radius:10px;padding:10px 12px}
        .ins-date-label{font-size:10px;color:var(--muted2);font-weight:600;margin-bottom:3px}
        .ins-date-val{font-size:13px;font-weight:800;color:var(--text)}
        .ins-progress{margin-top:12px}
        .ins-progress-label{display:flex;justify-content:space-between;font-size:11px;color:var(--muted2);margin-bottom:6px}
        .ins-progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden}
        .ins-progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
        .ins-actions{display:flex;gap:8px;margin-top:12px}
 
        /* MODAL */
        .modal-overlay{position:fixed;inset:0;z-index:500;background:rgba(0,0,0,.7);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
        @keyframes fadeIn{from{opacity:0}to{opacity:1}}
        @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
        .modal-box{background:var(--card);border:1px solid var(--border-gold);border-radius:28px 28px 0 0;padding:28px 20px 36px;width:100%;max-width:540px;animation:slideUp .3s cubic-bezier(.34,1.2,.64,1);max-height:90vh;overflow-y:auto}
        .modal-handle{width:40px;height:4px;background:var(--border);border-radius:4px;margin:0 auto 20px}
        .modal-title{font-size:17px;font-weight:900;margin-bottom:20px;display:flex;align-items:center;gap:8px}
        .modal-title i{color:var(--gold)}
        .modal-actions{display:flex;gap:10px;margin-top:20px}
 
        /* CONFIRM */
        .confirm-overlay{position:fixed;inset:0;z-index:600;background:rgba(0,0,0,.75);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn .2s ease}
        .confirm-box{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:28px 24px;width:100%;max-width:320px;text-align:center;animation:scaleIn .25s cubic-bezier(.34,1.2,.64,1)}
        @keyframes scaleIn{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
        .confirm-icon{width:60px;height:60px;background:var(--danger-dim);border-radius:18px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
        .confirm-icon i{color:var(--danger)}
        .confirm-title{font-size:17px;font-weight:900;color:var(--text);margin-bottom:8px}
        .confirm-sub{font-size:13px;color:var(--muted2);margin-bottom:24px;line-height:1.6}
        .confirm-actions{display:flex;gap:10px}
 
        /* CAR SWITCH */
        .car-list-item{background:var(--surface);border:1.5px solid var(--border);border-radius:16px;padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.2s}
        .car-list-item:hover{border-color:var(--border-gold)}
        .car-list-item.selected{border-color:var(--gold);background:var(--gold-dim)}
        .car-list-avatar{width:44px;height:44px;background:linear-gradient(135deg,var(--gold),#d97706);border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .car-list-avatar i{color:#000}
        .car-list-name{font-size:15px;font-weight:800;color:var(--text)}
        .car-list-year{font-size:12px;color:var(--muted2);margin-top:2px}
 
        /* CAR HEADER */
        .car-header{background:linear-gradient(135deg,rgba(245,158,11,.08),rgba(245,158,11,.02));border:1px solid var(--border-gold);border-radius:20px;padding:18px 20px;margin-bottom:16px;display:flex;align-items:center;gap:14px}
        .car-avatar{width:52px;height:52px;background:linear-gradient(135deg,var(--gold),#d97706);border-radius:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .car-avatar i{color:#000}
        .car-name{font-size:17px;font-weight:900;color:var(--text)}
        .car-year{font-size:12px;color:var(--muted2);margin-top:2px}
 
        /* FILTER PILLS */
        .filter-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin-bottom:16px}
        .pill{padding:7px 16px;border-radius:100px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted2);font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.2s;flex-shrink:0;font-family:'Cairo',sans-serif}
        .pill.active{background:var(--gold-dim);border-color:var(--border-gold);color:var(--gold)}
        .pill.pill-fine.active{background:var(--danger-dim);border-color:rgba(244,63,94,.3);color:var(--danger)}
        .pill.pill-ins.active{background:var(--purple-dim);border-color:rgba(139,92,246,.3);color:var(--purple)}
 
        /* TOAST */
        #toast{position:fixed;bottom:calc(var(--bottom-nav-h) + 12px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--border-gold);color:var(--text);padding:12px 24px;border-radius:100px;font-size:14px;font-weight:700;z-index:9999;pointer-events:none;transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;box-shadow:0 8px 32px rgba(0,0,0,.4);white-space:nowrap}
        #toast.show{transform:translateX(-50%) translateY(0);opacity:1}
 
        /* EMPTY */
        .empty-state{text-align:center;padding:40px 20px;color:var(--muted2)}
        .empty-state .ei{margin-bottom:12px;display:flex;justify-content:center;opacity:.4}
        .empty-state .ei i{color:var(--muted2)}
        .empty-state p{font-size:14px;margin-bottom:16px}
 
        /* ODO */
        .odo-display{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:24px;text-align:center;margin-bottom:16px}
        .odo-num{font-size:42px;font-weight:900;color:var(--gold);letter-spacing:-1px}
        .odo-label{font-size:12px;color:var(--muted2);margin-top:4px}
        .odo-warn{background:var(--danger-dim);border:1px solid rgba(244,63,94,.2);border-radius:10px;padding:10px 14px;font-size:12px;font-weight:700;color:var(--danger);margin-top:8px;display:none;align-items:center;gap:6px}
 
        /* NOTICE */
        .notice{border-radius:12px;padding:10px 14px;font-size:12px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .notice-gold{background:var(--gold-dim);border:1px solid var(--border-gold);color:var(--gold)}
        .notice-danger{background:var(--danger-dim);border:1px solid rgba(244,63,94,.2);color:var(--danger)}
        .notice-purple{background:var(--purple-dim);border:1px solid rgba(139,92,246,.2);color:var(--purple)}
 
        /* MISC */
        .hidden{display:none!important}
        .badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700}
        .badge-fuel{background:rgba(59,130,246,.15);color:#93c5fd}
        .badge-maint{background:var(--gold-dim);color:var(--gold-light)}
        .badge-fine{background:var(--danger-dim);color:var(--danger)}
        .badge-ins{background:var(--purple-dim);color:#c4b5fd}
        ::-webkit-scrollbar{width:4px;height:4px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
    </style>
</head>
<body>
 
<div id="splash">
    <div class="splash-logo"><i data-lucide="car" width="36" height="36"></i></div>
    <div class="splash-title">مركبتي السحابية</div>
    <div class="splash-spinner"></div>
</div>
 
<div id="auth-area" style="display:none">
    <div class="auth-glow"></div>
    <div class="auth-card">
        <div class="auth-icon"><i data-lucide="car" width="34" height="34"></i></div>
        <div class="auth-title">مركبتي السحابية</div>
        <div class="auth-sub">سجّل دخولك لإدارة مركباتك</div>
        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="user_id" placeholder="أدخل اسم المستخدم" autocomplete="username">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="user_pass" placeholder="••••••••" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter')handleAuth()">
        </div>
        <button class="btn btn-primary" id="auth-btn" onclick="handleAuth()">
            <i data-lucide="lock" width="16" height="16"></i> دخول آمن
        </button>
        <div id="auth-err" style="color:var(--danger);font-size:12px;margin-top:12px;display:none"></div>
    </div>
</div>
 
<div id="app-area" style="display:none">
    <div class="session-banner" id="session-banner">
        <i data-lucide="clock" width="14" height="14"></i>
        <span id="session-text"></span>
        <span onclick="renewSession()" style="cursor:pointer;text-decoration:underline;margin-right:8px">تجديد الجلسة</span>
    </div>
    <div class="header-bar">
        <div class="header-brand">
            <div class="header-logo"><i data-lucide="car" width="18" height="18"></i></div>
            <span class="header-name">مركبتي</span>
        </div>
        <div class="header-car-switch">
            <div class="car-switch-btn" onclick="openCarSwitchModal()">
                <i data-lucide="chevrons-up-down" width="14" height="14"></i>
                <span class="car-switch-name" id="header-car-name">—</span>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">
            <i data-lucide="log-out" width="13" height="13"></i> خروج
        </button>
    </div>
 
    <nav class="bottom-nav" id="main-nav">
        <div class="nav-item active" id="nav-p1" onclick="showTab('p1',this)">
            <i data-lucide="car" width="20" height="20"></i><span>مركبات</span>
        </div>
        <div class="nav-item" id="nav-p6" onclick="showTab('p6',this)">
            <i data-lucide="fuel" width="20" height="20"></i><span>وقود</span>
        </div>
        <div class="nav-item" id="nav-p2" onclick="showTab('p2',this)">
            <i data-lucide="wrench" width="20" height="20"></i><span>صيانة</span>
        </div>
        <div class="nav-item" id="nav-p3" onclick="showTab('p3',this)">
            <i data-lucide="gauge" width="20" height="20"></i><span>العداد</span>
        </div>
        <div class="nav-item" id="nav-p7" onclick="showTab('p7',this)">
            <i data-lucide="alert-triangle" width="20" height="20"></i><span>مصاريف</span>
        </div>
        <div class="nav-item" id="nav-p5" onclick="showTab('p5',this)">
            <i data-lucide="scroll-text" width="20" height="20"></i><span>السجل</span>
        </div>
        <div class="nav-item" id="nav-p4" onclick="showTab('p4',this)">
            <i data-lucide="bar-chart-2" width="20" height="20"></i><span>إحصائيات</span>
        </div>
    </nav>
 
    <main class="main-content" id="content-area"></main>
</div>
 
<div id="toast"></div>
<div id="edit-modal"       style="display:none"></div>
<div id="confirm-modal"    style="display:none"></div>
<div id="car-switch-modal" style="display:none"></div>
<div id="extra-modal"      style="display:none"></div>
 
<script>
// ══════════════════════════════════════════
// FIREBASE
// ══════════════════════════════════════════
const firebaseConfig = {
    apiKey:"AIzaSyBqoe2iVnMTZ6nIdVjyZTdViM7XMiwehAg",
    authDomain:"car-tracker-78f7b.firebaseapp.com",
    databaseURL:"https://car-tracker-78f7b-default-rtdb.firebaseio.com",
    projectId:"car-tracker-78f7b",
    storageBucket:"car-tracker-78f7b.firebasestorage.app",
    appId:"1:7295247933:web:3e88e9423c39c2edeeac54"
};
firebase.initializeApp(firebaseConfig);
const db   = firebase.database();
const auth = firebase.auth();
 
// ══════════════════════════════════════════
// STATE
// ══════════════════════════════════════════
let cars          = [];
let activeIdx     = 0;
let userId        = null;
let currentFilter = 'الكل';
let extraFilter   = 'الكل';   // فلتر تبويب المصاريف
let currentTabId  = 'p1';
let isAddingNew   = false;
let dbRef         = null;     // FIX #2: نحتفظ بـ reference للـ listener
 
const SESSION_DURATION = 8*60*60*1000;
let sessionTimer = null, sessionWarningTimer = null;
 
// ══════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════
function initIcons(){ if(window.lucide) lucide.createIcons(); }
 
// FIX #4: escape HTML لمنع XSS
function esc(str){
    if(str==null) return '';
    return String(str)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#39;');
}
 
function hideSplash(){
    const s=document.getElementById('splash');
    s.classList.add('hide');
    setTimeout(()=>s.style.display='none',400);
}
 
function toast(msg,duration=2500){
    const t=document.getElementById('toast');
    t.textContent=msg; t.classList.add('show');
    clearTimeout(t._t);
    t._t=setTimeout(()=>t.classList.remove('show'),duration);
}
 
// FIX #3: helper لإعادة الزر لحالته بعد خطأ Firebase
function resetBtn(id,html){
    const b=document.getElementById(id);
    if(b){b.disabled=false;b.innerHTML=html;}
}
 
// ══════════════════════════════════════════
// SESSION — FIX #4 grace + تجديد
// ══════════════════════════════════════════
const GRACE_MS = 60*1000;
 
function startSession(){
    localStorage.setItem('loginTime',Date.now());
    hideBanner(); scheduleSessionCheck();
}
function renewSession(){ startSession(); toast('تم تجديد الجلسة ✓'); }
function hideBanner(){
    const b=document.getElementById('session-banner');
    if(b) b.style.display='none';
}
function scheduleSessionCheck(){
    clearTimeout(sessionTimer); clearTimeout(sessionWarningTimer);
    const loginTime=parseInt(localStorage.getItem('loginTime')||'0');
    const remaining=SESSION_DURATION-(Date.now()-loginTime);
    if(remaining<=0){auth.signOut();return;}
    const warnAt=remaining-15*60*1000;
    if(warnAt>0){
        sessionWarningTimer=setTimeout(()=>{
            const banner=document.getElementById('session-banner');
            const text=document.getElementById('session-text');
            if(banner&&text){text.textContent='ستنتهي جلستك خلال 15 دقيقة —';banner.style.display='flex';initIcons();}
        },warnAt);
    } else {
        const banner=document.getElementById('session-banner');
        const text=document.getElementById('session-text');
        if(banner&&text){text.textContent='ستنتهي جلستك قريباً —';banner.style.display='flex';initIcons();}
    }
    sessionTimer=setTimeout(()=>{auth.signOut();toast('انتهت الجلسة، يرجى تسجيل الدخول مجدداً',4000);},remaining);
}
function isSessionValid(){
    const t=parseInt(localStorage.getItem('loginTime')||'0');
    return t && (Date.now()-t)<(SESSION_DURATION+GRACE_MS);
}
 
// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
auth.onAuthStateChanged(user=>{
    if(user){
        const loginTime=parseInt(localStorage.getItem('loginTime')||'0');
        if(loginTime&&!isSessionValid()){auth.signOut();hideSplash();return;}
        userId=user.uid;
        if(loginTime) scheduleSessionCheck();
        setTimeout(()=>{
            hideSplash();
            document.getElementById('auth-area').style.display='none';
            document.getElementById('app-area').style.display='block';
            document.getElementById('main-nav').style.display='flex';
            syncData(); initIcons();
        },1200);
    } else {
        // FIX #2: ألغِ الـ listener القديم عند الخروج
        if(dbRef){dbRef.off();dbRef=null;}
        localStorage.removeItem('loginTime');
        clearTimeout(sessionTimer); clearTimeout(sessionWarningTimer);
        setTimeout(()=>{
            hideSplash();
            document.getElementById('auth-area').style.display='flex';
            document.getElementById('app-area').style.display='none';
            initIcons();
        },1200);
    }
});
 
function handleAuth(){
    const user=document.getElementById('user_id').value.trim().toLowerCase();
    const pass=document.getElementById('user_pass').value;
    const errEl=document.getElementById('auth-err');
    const btn=document.getElementById('auth-btn');
    errEl.style.display='none';
    if(!user||!pass){errEl.textContent='يرجى إدخال اسم المستخدم وكلمة المرور';errEl.style.display='block';return;}
    if(pass.length<6){errEl.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل';errEl.style.display='block';return;}
    btn.disabled=true;
    btn.innerHTML='<div class="btn-spinner"></div> جاري الدخول...';
    const email=user+'@app.com';
    localStorage.setItem('loginTime',Date.now());
 
    // FIX #1: نميّز بين "مستخدم غير موجود" وغيره
    auth.signInWithEmailAndPassword(email,pass)
        .catch(err=>{
            if(err.code==='auth/user-not-found'||err.code==='auth/invalid-credential'||err.code==='auth/invalid-email'){
                return auth.createUserWithEmailAndPassword(email,pass);
            }
            throw err; // كلمة مرور خاطئة أو خطأ آخر → ابقَ في الـ catch
        })
        .catch(err=>{
            localStorage.removeItem('loginTime');
            let msg='حدث خطأ، تحقق من البيانات';
            if(err.code==='auth/wrong-password'||err.code==='auth/invalid-credential') msg='كلمة المرور غير صحيحة';
            if(err.code==='auth/too-many-requests') msg='محاولات كثيرة، حاول لاحقاً';
            errEl.textContent=msg; errEl.style.display='block';
            btn.disabled=false;
            btn.innerHTML='<i data-lucide="lock" width="16" height="16"></i> دخول آمن';
            initIcons();
        });
}
 
function logout(){localStorage.removeItem('loginTime');auth.signOut();}
 
// ══════════════════════════════════════════
// SYNC — FIX #2: listener واحد فقط
// ══════════════════════════════════════════
function syncData(){
    if(dbRef) dbRef.off(); // ألغِ القديم قبل تسجيل جديد
    dbRef=db.ref('users/'+userId+'/garage');
    dbRef.on('value',snap=>{
        const data=snap.val();
        const newCars=data?Object.keys(data).map(k=>({...data[k],id:k})):[];
        if(cars.length>0&&activeIdx<cars.length&&cars[activeIdx]?.id){
            const curId=cars[activeIdx].id;
            const ni=newCars.findIndex(c=>c.id===curId);
            activeIdx=ni>=0?ni:0;
        } else {
            activeIdx=Math.min(activeIdx,Math.max(0,newCars.length-1));
        }
        isAddingNew=false;
        cars=newCars;
        updateHeaderCar();
        showTab(currentTabId);
    });
}
 
function updateHeaderCar(){
    const el=document.getElementById('header-car-name');
    if(el) el.textContent=cars[activeIdx]?cars[activeIdx].type:'لا توجد مركبة';
}
 
// ══════════════════════════════════════════
// CAR SWITCH MODAL
// ══════════════════════════════════════════
function openCarSwitchModal(){
    const modal=document.getElementById('car-switch-modal');
    Object.assign(modal.style,{display:'flex',position:'fixed',inset:'0',zIndex:'500',
        alignItems:'flex-end',justifyContent:'center',
        background:'rgba(0,0,0,0.7)',backdropFilter:'blur(6px)'});
    const items=cars.map((c,i)=>`
        <div class="car-list-item ${i===activeIdx?'selected':''}" onclick="switchCar(${i})">
            <div class="car-list-avatar"><i data-lucide="car" width="22" height="22"></i></div>
            <div><div class="car-list-name">${esc(c.type)}</div>
            <div class="car-list-year">${c.model?esc(c.model)+' · ':''}${esc(c.lastOdo)||'0 كم'}</div></div>
            ${i===activeIdx?'<i data-lucide="check" width="18" height="18" style="color:var(--gold);margin-right:auto"></i>':''}
        </div>`).join('');
    modal.innerHTML=`<div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title"><i data-lucide="car" width="20" height="20"></i> اختر المركبة</div>
        ${cars.length===0?`<div class="empty-state"><div class="ei"><i data-lucide="car" width="48" height="48"></i></div><p>لا توجد مركبات مضافة</p></div>`:items}
        <button class="btn btn-ghost" style="margin-top:10px" onclick="closeCarSwitchModal()">إغلاق</button>
    </div>`;
    modal.onclick=e=>{if(e.target===modal)closeCarSwitchModal();};
    initIcons();
}
function switchCar(idx){
    activeIdx=idx; currentFilter='الكل'; extraFilter='الكل';
    updateHeaderCar(); closeCarSwitchModal();
    showTab(currentTabId); toast('تم التبديل إلى '+cars[idx].type+' ✓');
}
function closeCarSwitchModal(){const m=document.getElementById('car-switch-modal');m.style.display='none';m.innerHTML='';}
 
// ══════════════════════════════════════════
// SNIPPETS
// ══════════════════════════════════════════
function carHeaderHTML(){
    const car=cars[activeIdx];
    if(!car)return'';
    return`<div class="car-header">
        <div class="car-avatar"><i data-lucide="car" width="26" height="26"></i></div>
        <div><div class="car-name">${esc(car.type)}</div>
        <div class="car-year">${car.model?esc(car.model)+' · ':''}${esc(car.lastOdo)||'0 كم'}</div></div>
    </div>`;
}
function noCar(icon){
    return`<div class="section-card"><div class="empty-state">
        <div class="ei"><i data-lucide="${icon}" width="48" height="48"></i></div>
        <p>اختر مركبة أولاً</p>
        <button class="btn btn-primary btn-sm" style="width:auto;padding:0 24px" onclick="openCarSwitchModal()">
            <i data-lucide="car" width="14" height="14"></i> اختر مركبة
        </button></div></div>`;
}
 
// ══════════════════════════════════════════
// SHOW TAB
// ══════════════════════════════════════════
function showTab(tabId,el){
    currentTabId=tabId;
    document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
    const navEl=el||document.getElementById('nav-'+tabId);
    if(navEl) navEl.classList.add('active');
 
    // إعادة ضبط isAddingNew عند مغادرة p1 — FIX #6
    if(tabId!=='p1') isAddingNew=false;
 
    const area=document.getElementById('content-area');
    const car=cars[activeIdx];
 
    // ── VEHICLES ──
    if(tabId==='p1'){
        const vType =isAddingNew?'':(car?car.type:'');
        const vModel=isAddingNew?'':(car?car.model||'':'');
        area.innerHTML=`<div class="section-card">
            <div class="section-title"><i data-lucide="car" width="18" height="18"></i>
                ${isAddingNew?'إضافة مركبة جديدة':'المركبات'}</div>
            ${isAddingNew?`<div class="notice notice-gold"><i data-lucide="info" width="14" height="14"></i> أدخل بيانات المركبة الجديدة ثم اضغط حفظ</div>`:''}
            <div class="input-group"><label>الماركة / الطراز</label>
                <input type="text" id="v_type" value="${esc(vType)}" placeholder="مثال: نيسان التيما 2026"></div>
            <div class="input-group"><label>سنة الصنع</label>
                <input type="text" id="v_model" value="${esc(vModel)}" placeholder="مثال: 2026"></div>
            <button class="btn btn-primary" id="save-car-btn" onclick="saveCar()">
                <i data-lucide="check" width="16" height="16"></i> حفظ</button>
            <div style="margin-top:10px;display:flex;gap:10px">
                ${!isAddingNew?`<button class="btn btn-ghost btn-sm" style="flex:1" onclick="startAddNewCar()">
                    <i data-lucide="plus" width="14" height="14"></i> إضافة مركبة</button>`
                :`<button class="btn btn-ghost btn-sm" style="flex:1" onclick="cancelAddCar()">
                    <i data-lucide="x" width="14" height="14"></i> إلغاء</button>`}
                ${car&&!isAddingNew?`<button class="btn btn-danger-ghost btn-sm" style="flex:1" onclick="confirmDeleteCar()">
                    <i data-lucide="trash-2" width="14" height="14"></i> حذف المركبة</button>`:''}
            </div></div>`;
        if(isAddingNew) setTimeout(()=>document.getElementById('v_type')?.focus(),100);
    }
 
    // ── STATS ──
    else if(tabId==='p4'){
        if(!car){area.innerHTML=`<div class="section-card"><div class="empty-state"><div class="ei"><i data-lucide="bar-chart-2" width="48" height="48"></i></div><p>لا توجد مركبات</p></div></div>`;initIcons();return;}
        const logs =car.logs  ?Object.values(car.logs) :[];
        const fines=car.fines ?Object.values(car.fines):[];
        const ins  =car.insurance?Object.values(car.insurance):[];
        const maint=logs.filter(l=>l.cat==='صيانة').reduce((a,b)=>a+Number(b.price),0);
        const fuel =logs.filter(l=>l.cat==='وقود' ).reduce((a,b)=>a+Number(b.price),0);
        const finesTotal=fines.reduce((a,b)=>a+Number(b.price),0);
        const insTotal  =ins.reduce((a,b)=>a+Number(b.price),0);
        const total=maint+fuel+finesTotal+insTotal;
        const md=buildMonthlyChart(logs);
        area.innerHTML=`${carHeaderHTML()}
            <div class="section-card">
                <div class="section-title"><i data-lucide="bar-chart-2" width="18" height="18"></i> الإحصائيات</div>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon"><i data-lucide="wrench" width="22" height="22"></i></div>
                        <span class="stat-label">الصيانة</span><span class="stat-value">${maint.toLocaleString()}</span><span class="stat-unit">ريال</span></div>
                    <div class="stat-card"><div class="stat-icon"><i data-lucide="fuel" width="22" height="22"></i></div>
                        <span class="stat-label">الوقود</span><span class="stat-value">${fuel.toLocaleString()}</span><span class="stat-unit">ريال</span></div>
                    <div class="stat-card"><div class="stat-icon" style="color:var(--danger)"><i data-lucide="alert-octagon" width="22" height="22" style="color:var(--danger)"></i></div>
                        <span class="stat-label">المخالفات</span><span class="stat-value" style="color:var(--danger)">${finesTotal.toLocaleString()}</span><span class="stat-unit">ريال</span></div>
                    <div class="stat-card"><div class="stat-icon" style="color:var(--purple)"><i data-lucide="shield" width="22" height="22" style="color:var(--purple)"></i></div>
                        <span class="stat-label">التأمين</span><span class="stat-value" style="color:var(--purple)">${insTotal.toLocaleString()}</span><span class="stat-unit">ريال</span></div>
                    <div class="stat-card"><div class="stat-icon"><i data-lucide="gauge" width="22" height="22"></i></div>
                        <span class="stat-label">العداد</span><span class="stat-value">${parseInt(car.lastOdo)||0}</span><span class="stat-unit">كم</span></div>
                    <div class="stat-card"><div class="stat-icon"><i data-lucide="file-text" width="22" height="22"></i></div>
                        <span class="stat-label">السجلات</span><span class="stat-value">${logs.length+fines.length+ins.length}</span><span class="stat-unit">عملية</span></div>
                    <div class="stat-card total"><div class="stat-icon"><i data-lucide="wallet" width="22" height="22"></i></div>
                        <span class="stat-label">الإجمالي الكلي</span><span class="stat-value">${total.toLocaleString()}</span><span class="stat-unit">ريال سعودي</span></div>
                </div>
                ${md.hasData?renderChart(md):''}
            </div>`;
    }
 
    // ── MAINTENANCE ──
    else if(tabId==='p2'){
        if(!car){area.innerHTML=noCar('wrench');initIcons();return;}
        area.innerHTML=`${carHeaderHTML()}<div class="section-card">
            <div class="section-title"><i data-lucide="wrench" width="18" height="18"></i> تسجيل صيانة</div>
            <div class="input-group"><label>نوع الصيانة</label>
                <div class="select-wrap"><select id="m_type_sel" onchange="toggleManualMaint()">
                    <option value="زيت المحرك">زيت المحرك</option>
                    <option value="زيت القير">زيت القير</option>
                    <option value="تغيير كفرات">تغيير كفرات</option>
                    <option value="فلتر مكينة">فلتر مكينة</option>
                    <option value="أخرى">أخرى</option>
                </select></div></div>
            <div id="manual_m_group" class="input-group hidden"><label>وصف الصيانة</label>
                <input type="text" id="m_t_manual" placeholder="اكتب نوع الصيانة"></div>
            <div class="input-group"><label>التكلفة (ر.س)</label>
                <input type="number" id="m_p" placeholder="0" min="0"></div>
            <div class="input-group"><label>التاريخ</label>
                <input type="date" id="m_d"></div>
            <button class="btn btn-primary" id="maint-btn" onclick="addLog('صيانة')">
                <i data-lucide="wrench" width="16" height="16"></i> تسجيل الصيانة</button>
        </div>`;
        document.getElementById('m_d').valueAsDate=new Date();
    }
 
    // ── FUEL ──
    else if(tabId==='p6'){
        if(!car){area.innerHTML=noCar('fuel');initIcons();return;}
        area.innerHTML=`${carHeaderHTML()}<div class="section-card">
            <div class="section-title"><i data-lucide="fuel" width="18" height="18"></i> تعبئة وقود</div>
            <div class="input-group"><label>قيمة التعبئة (ر.س)</label>
                <input type="number" id="f_p" placeholder="0" min="0"></div>
            <div class="input-group"><label>التاريخ</label>
                <input type="date" id="f_d"></div>
            <button class="btn btn-primary" id="fuel-btn" onclick="addLog('وقود')">

function renderExtra(){
    const car=cars[activeIdx];
    const container=document.getElementById('extra_container');
    if(!container)return;
 
    const fines=car.fines   ?Object.keys(car.fines).map(k=>({...car.fines[k],key:k,_type:'fine'})):[];
    const ins  =car.insurance?Object.keys(car.insurance).map(k=>({...car.insurance[k],key:k,_type:'ins'})):[];
 
    let items=[];
    if(extraFilter==='الكل')    items=[...fines,...ins];
    else if(extraFilter==='مخالفات') items=fines;
    else items=ins;
 
    if(items.length===0){
        container.innerHTML=`<div class="empty-state">
            <div class="ei"><i data-lucide="${extraFilter==='تأمين'?'shield':'alert-octagon'}" width="48" height="48"></i></div>
            <p>لا توجد سجلات</p></div>`;
        initIcons();return;
    }
 
    // ترتيب بالتاريخ (الأحدث أولاً)
    items.sort((a,b)=>{
        const da=a._type==='fine'?a.date:(a.startDate||'');
        const db2=b._type==='fine'?b.date:(b.startDate||'');
        return db2.localeCompare(da);
    });
 
    container.innerHTML=items.map(item=>{
        if(item._type==='fine') return renderFineItem(item);
        return renderInsItem(item);
    }).join('');
    initIcons();
}

function renderInsItem(ins){
    const today=new Date(); today.setHours(0,0,0,0);
    const end=ins.endDate?new Date(ins.endDate):null;
    let statusClass='status-active', statusLabel='فعّال';
    let daysLeft=null;
    if(end){
        const diff=Math.ceil((end-today)/(1000*60*60*24));
        daysLeft=diff;
        if(diff<0){statusClass='status-expired';statusLabel='منتهي';}
        else if(diff<=30){statusClass='status-expiring';statusLabel=`ينتهي بعد ${diff} يوم`;}
    }
    // حساب نسبة التقدم
    let progress=100;
    if(ins.startDate&&ins.endDate){
        const s=new Date(ins.startDate),e=new Date(ins.endDate);
        const total=e-s; const elapsed=today-s;
        progress=total>0?Math.min(100,Math.max(0,Math.round((elapsed/total)*100))):100;
    }
    const barColor=statusClass==='status-expired'?'var(--danger)':statusClass==='status-expiring'?'var(--gold)':'var(--success)';
 
    return`<div class="ins-card">
        <div class="ins-card-header">
            <div class="ins-avatar"><i data-lucide="shield" width="22" height="22"></i></div>
            <div style="flex:1">
                <div class="ins-title">${esc(ins.insType||'تأمين')}</div>
                <div class="ins-type">${esc(ins.company||'')}</div>
            </div>
            <span class="status-badge ${statusClass}">${statusLabel}</span>
        </div>
        <div class="ins-dates">
            <div class="ins-date-item">
                <div class="ins-date-label">تاريخ البداية</div>
                <div class="ins-date-val">${esc(ins.startDate)||'—'}</div>
            </div>
            <div class="ins-date-item">
                <div class="ins-date-label">تاريخ الانتهاء</div>
                <div class="ins-date-val">${esc(ins.endDate)||'—'}</div>
            </div>
        </div>
        ${ins.startDate&&ins.endDate?`
        <div class="ins-progress">
            <div class="ins-progress-label">
                <span>نسبة المنقضي</span><span>${progress}%</span>
            </div>
            <div class="ins-progress-bar">
                <div class="ins-progress-fill" style="width:${progress}%;background:${barColor}"></div>
            </div>
        </div>`:''}
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
            <div>
                <div class="log-price" style="font-size:15px">${Number(ins.price).toLocaleString()} ر.س</div>
                ${ins.payMethod?`<div style="font-size:11px;color:var(--muted2);margin-top:4px">
                    ${ins.payMethod==='أقساط'?`📆 أقساط · ${ins.instalments} قسط · ${Math.round(ins.price/ins.instalments).toLocaleString()} ر.س/قسط`:'💵 كاش'}

            </div>
            <div style="display:flex;gap:6px">
                <div class="log-edit" onclick="openInsEditModal('${ins.key}')"><i data-lucide="pencil" width="15" height="15"></i></div>
                <div class="log-del"  onclick="confirmDeleteExtra('ins','${ins.key}')"><i data-lucide="trash-2" width="15" height="15"></i></div>
            </div>
        </div>
    </div>`;
}

function saveIns(existingKey){
    const car=cars[activeIdx];
    if(!car){toast('اختر مركبة أولاً');return;}
    const insType =document.getElementById('ins_type').value;
    const company =document.getElementById('ins_company').value.trim();
    const priceRaw=document.getElementById('ins_price').value;
    const startDate=document.getElementById('ins_start').value;
    const endDate  =document.getElementById('ins_end').value;
    const price=parseFloat(priceRaw);
    if(!priceRaw||isNaN(price)||price<0){toast('أدخل مبلغاً صحيحاً');return;}
    if(!startDate||!endDate){toast('أدخل تواريخ البداية والانتهاء');return;}
    if(endDate<=startDate){toast('تاريخ الانتهاء يجب أن يكون بعد البداية');return;}
    const payMethod   =document.getElementById('ins_pay_method').value;
    const instalmentsRaw=document.getElementById('ins_instalments')?.value;
    const instalments =payMethod==='أقساط'?(parseInt(instalmentsRaw)||0):0;
    if(payMethod==='أقساط'&&instalments<2){toast('أدخل عدد أقساط صحيح (2 أو أكثر)');return;}
    const btn=document.getElementById('save-ins-btn');
    btn.disabled=true;btn.innerHTML='<div class="btn-spinner"></div>';
 
    const ref=existingKey
        ?db.ref(`users/${userId}/garage/${car.id}/insurance/${existingKey}`)
        :db.ref(`users/${userId}/garage/${car.id}/insurance`).push();
    const payload={insType,company,price,startDate,endDate,payMethod};
    if(payMethod==='أقساط') payload.instalments=instalments;
    ref.set(payload)
        .then(()=>{
            closeExtraModal();
            toast(existingKey?'تم التعديل ✓':'تمت إضافة التأمين ✓');
            extraFilter='تأمين';showTab('p7');
            // تحقق إذا ينتهي قريباً
            const daysLeft=Math.ceil((new Date(endDate)-new Date())/(1000*60*60*24));
            if(daysLeft>=0&&daysLeft<=30) toast(`⚠️ التأمين ينتهي بعد ${daysLeft} يوم`,4000);
        })
        .catch(()=>{resetBtn('save-ins-btn','<i data-lucide="check" width="16" height="16"></i> حفظ');toast('حدث خطأ، حاول مجدداً');initIcons();});
}

function confirmDeleteExtra(type,key){

    const carId=car.id;
    const label=type==='fine'?'المخالفة':'وثيقة التأمين';
    const path=type==='fine'?'fines':'insurance';
    showConfirm(`حذف ${label}`,`هل أنت متأكد من الحذف؟ لا يمكن التراجع.`,()=>{
        db.ref(`users/${userId}/garage/${carId}/${path}/${key}`).remove()

// CHART
// ══════════════════════════════════════════
function buildMonthlyChart(logs){
    if(!logs.length)return{hasData:false};
    const months={},now=new Date();
    for(let i=5;i>=0;i--){
        const d=new Date(now.getFullYear(),now.getMonth()-i,1);
        const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
        months[k]={label:d.toLocaleDateString('ar-SA',{month:'short'}),fuel:0,maint:0};
    }
    logs.forEach(l=>{
        if(!l.date)return;
        const k=l.date.substring(0,7);
        if(months[k]){
            if(l.cat==='وقود')months[k].fuel+=Number(l.price);
            else months[k].maint+=Number(l.price);
        }
    });
    const data=Object.values(months);
    const maxVal=Math.max(...data.map(d=>Math.max(d.fuel,d.maint)),1);
    return{data,maxVal,hasData:data.some(d=>d.fuel>0||d.maint>0)};
}
function renderChart({data,maxVal}){
    const bars=data.map(d=>{
        const fh=Math.max((d.fuel/maxVal)*80,d.fuel>0?4:0);
        const mh=Math.max((d.maint/maxVal)*80,d.maint>0?4:0);
        return`<div class="chart-bar-wrap">
            <div style="display:flex;gap:2px;align-items:flex-end;height:80px">
                <div class="chart-bar fuel-bar"  style="height:${fh}px;flex:1"></div>
                <div class="chart-bar maint-bar" style="height:${mh}px;flex:1"></div>
            </div>
            <div class="chart-label">${d.label}</div>
        </div>`;
    }).join('');
    return`<div class="chart-wrap">
        <div class="chart-title">المصروفات الشهرية (آخر 6 أشهر)</div>
        <div class="chart-bars">${bars}</div>
        <div class="chart-legend">
            <div class="legend-item"><div class="legend-dot" style="background:#3b82f6"></div>وقود</div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--gold)"></div>صيانة</div>
        </div>
    </div>`;
}
 
// ══════════════════════════════════════════
// FILTER
// ══════════════════════════════════════════
function setFilter(f){
    currentFilter=f;
    document.querySelectorAll('.pill:not(.pill-fine):not(.pill-ins)').forEach(p=>p.classList.toggle('active',p.textContent===f));
    renderLogs();
}
 
// ══════════════════════════════════════════
// RENDER LOGS
// ══════════════════════════════════════════
function renderLogs(){
    const car=cars[activeIdx];
    const container=document.getElementById('logs_container');
    if(!car||!car.logs){
        container.innerHTML=`<div class="empty-state">
            <div class="ei"><i data-lucide="clipboard-list" width="48" height="48"></i></div>
            <p>لا توجد سجلات بعد</p>
            <button class="btn btn-primary btn-sm" style="width:auto;padding:0 24px" onclick="showTab('p6')">
                <i data-lucide="fuel" width="14" height="14"></i> سجّل أول عملية</button></div>`;
        initIcons();return;
    }
    const arr=Object.keys(car.logs).map(k=>({...car.logs[k],key:k}));
    const filtered=currentFilter==='الكل'?arr:arr.filter(l=>l.title.includes(currentFilter)||l.cat.includes(currentFilter));
    if(filtered.length===0){
        container.innerHTML=`<div class="empty-state"><div class="ei"><i data-lucide="search-x" width="48" height="48"></i></div><p>لا توجد نتائج</p></div>`;
        initIcons();return;
    }
    const total=filtered.reduce((a,b)=>a+Number(b.price),0);
    container.innerHTML=filtered.slice().reverse().map(l=>{
        const isFuel=l.cat==='وقود';
        return`<div class="log-item">
            <div class="log-dot ${isFuel?'fuel':'maint'}">
                <i data-lucide="${isFuel?'fuel':'wrench'}" width="18" height="18"></i></div>
            <div class="log-info">
                <div class="log-title">${esc(l.title)}</div>
                <div class="log-meta">${esc(l.date)} · <span class="badge ${isFuel?'badge-fuel':'badge-maint'}">${l.cat}</span></div>
            </div>
            <div class="log-price">${Number(l.price).toLocaleString()} ر.س</div>
            <div class="log-edit" onclick="openEditModal('${l.key}')"><i data-lucide="pencil" width="15" height="15"></i></div>
            <div class="log-del"  onclick="confirmDeleteLog('${l.key}')"><i data-lucide="trash-2" width="15" height="15"></i></div>
        </div>`;
    }).join('')+`<div class="log-total">
        <span class="log-total-label">الإجمالي (${filtered.length} عملية)</span>
        <span class="log-total-value">${total.toLocaleString()} ر.س</span>
    </div>`;
    initIcons();
}
 
// ══════════════════════════════════════════
// CONFIRM MODAL
// ══════════════════════════════════════════
let _confirmCb=null;
function showConfirm(title,sub,onConfirm){
    const modal=document.getElementById('confirm-modal');
    Object.assign(modal.style,{display:'flex',position:'fixed',inset:'0',zIndex:'600',
        alignItems:'center',justifyContent:'center',padding:'20px',
        background:'rgba(0,0,0,0.75)',backdropFilter:'blur(8px)'});
    modal.innerHTML=`<div class="confirm-box">
        <div class="confirm-icon"><i data-lucide="trash-2" width="28" height="28"></i></div>
        <div class="confirm-title">${esc(title)}</div>
        <div class="confirm-sub">${esc(sub)}</div>
        <div class="confirm-actions">
            <button class="btn btn-ghost" style="flex:1" onclick="closeConfirm()">إلغاء</button>
            <button class="btn btn-danger-ghost" style="flex:1" onclick="confirmAction()">
                <i data-lucide="trash-2" width="14" height="14"></i> حذف</button>
        </div>
    </div>`;
    _confirmCb=onConfirm;
    modal.onclick=e=>{if(e.target===modal)closeConfirm();};
    initIcons();
}
function confirmAction(){closeConfirm();if(_confirmCb)_confirmCb();}
function closeConfirm(){const m=document.getElementById('confirm-modal');m.style.display='none';m.innerHTML='';_confirmCb=null;}
 
// ══════════════════════════════════════════
// DELETE LOG
// ══════════════════════════════════════════
function confirmDeleteLog(key){
    const car=cars[activeIdx];
    if(!car?.id)return;
    // نحفظ carId مسبقاً
    const carId=car.id;
    showConfirm('حذف العملية','هل أنت متأكد من حذف هذه العملية؟ لا يمكن التراجع.',()=>{
        db.ref(`users/${userId}/garage/${carId}/logs/${key}`).remove()
            .then(()=>{
                toast('تم الحذف ✓');
                // حذف محلي فوري قبل sync
                const updatedCar=cars[activeIdx];
                if(updatedCar?.logs) delete updatedCar.logs[key];
                renderLogs();
            })
            .catch(e=>{
                console.error('delete log',e);
                toast('فشل الحذف — تحقق من الاتصال');
            });
    });
}
 
// ══════════════════════════════════════════
// EDIT MODAL — FIX #8 esc في value
// ══════════════════════════════════════════
function openEditModal(key){
    const car=cars[activeIdx];
    if(!car?.logs?.[key])return;
    const l=car.logs[key];
    const modal=document.getElementById('edit-modal');
    Object.assign(modal.style,{display:'flex',position:'fixed',inset:'0',zIndex:'500',
        alignItems:'flex-end',justifyContent:'center',
        background:'rgba(0,0,0,0.7)',backdropFilter:'blur(6px)'});
    modal.innerHTML=`<div class="modal-box">
        <div class="modal-handle"></div>
        <div class="modal-title"><i data-lucide="pencil" width="18" height="18"></i> تعديل العملية</div>
        <div class="input-group"><label>التفاصيل</label>
            <input type="text" id="edit_title" value="${esc(l.title)}"></div>
        <div class="input-group"><label>المبلغ (ر.س)</label>
            <input type="number" id="edit_price" value="${esc(String(l.price))}" min="0"></div>
        <div class="input-group"><label>التاريخ</label>
            <input type="date" id="edit_date" value="${esc(l.date)}"></div>
        <div class="modal-actions">
            <button class="btn btn-ghost" style="flex:1" onclick="closeEditModal()">إلغاء</button>
            <button class="btn btn-primary" style="flex:2" id="save-edit-btn" onclick="saveEdit('${key}')">
                <i data-lucide="check" width="16" height="16"></i> حفظ التعديلات</button>
        </div>
    </div>`;
    modal.onclick=e=>{if(e.target===modal)closeEditModal();};
    initIcons();
}
function closeEditModal(){const m=document.getElementById('edit-modal');m.style.display='none';m.innerHTML='';}
 
function saveEdit(key){
    const title=document.getElementById('edit_title').value.trim();
    const price=document.getElementById('edit_price').value;
    const date =document.getElementById('edit_date').value;
    if(!title){toast('أدخل التفاصيل');return;}
    const p=parseFloat(price);
    if(isNaN(p)||p<0){toast('أدخل مبلغاً صحيحاً');return;}  // FIX #6 + تحقق
    const btn=document.getElementById('save-edit-btn');
    btn.disabled=true;btn.innerHTML='<div class="btn-spinner"></div>';
    db.ref(`users/${userId}/garage/${cars[activeIdx].id}/logs/${key}`)
        .update({title,price:p,date})
        .then(()=>{closeEditModal();toast('تم التعديل ✓');renderLogs();})
        .catch(()=>{resetBtn('save-edit-btn','<i data-lucide="check" width="16" height="16"></i> حفظ التعديلات');toast('حدث خطأ');initIcons();}); // FIX #3
}
 
// ══════════════════════════════════════════
// CAR CRUD — FIX #2
// ══════════════════════════════════════════
function startAddNewCar(){isAddingNew=true;showTab('p1');}
function cancelAddCar()  {isAddingNew=false;showTab('p1');}
 
function saveCar(){
    const type=document.getElementById('v_type').value.trim();
    if(!type){toast('أدخل اسم المركبة');return;}
    const btn=document.getElementById('save-car-btn');
    btn.disabled=true;btn.innerHTML='<div class="btn-spinner"></div> جاري الحفظ...';
    if(isAddingNew){
        const carId=db.ref('users/'+userId+'/garage').push().key;
        db.ref(`users/${userId}/garage/${carId}`)
            .set({id:carId,type,model:document.getElementById('v_model').value,lastOdo:'0 كم'})
            .then(()=>{isAddingNew=false;toast('تمت إضافة المركبة ✓');})
            .catch(()=>{resetBtn('save-car-btn','<i data-lucide="check" width="16" height="16"></i> حفظ');toast('حدث خطأ');initIcons();}); // FIX #3
    } else {
        if(!cars[activeIdx]?.id){toast('خطأ: لا توجد مركبة محددة');resetBtn('save-car-btn','<i data-lucide="check" width="16" height="16"></i> حفظ');initIcons();return;}
        db.ref(`users/${userId}/garage/${cars[activeIdx].id}`)
            .update({type,model:document.getElementById('v_model').value})
            .then(()=>toast('تم الحفظ ✓'))
            .catch(()=>{resetBtn('save-car-btn','<i data-lucide="check" width="16" height="16"></i> حفظ');toast('حدث خطأ');initIcons();}); // FIX #3
    }
}
 
function confirmDeleteCar(){
    const car=cars[activeIdx];
    if(!car?.id)return;
    // نحفظ id و name قبل فتح الـ dialog — لا نعتمد على activeIdx داخل الـ callback
    const carId=car.id;
    const carName=car.type;
    showConfirm('حذف المركبة',`هل أنت متأكد من حذف "${carName}"؟ ستُحذف جميع البيانات نهائياً.`,()=>{
        db.ref(`users/${userId}/garage/${carId}`).remove()
            .then(()=>{
                activeIdx=0;
                toast('تم حذف المركبة ✓');
            })
            .catch(e=>{
                console.error('delete car',e);
                toast('فشل الحذف — تحقق من الاتصال');
            });
    });
}
 
// ══════════════════════════════════════════
// ADD LOG — FIX #6
// ══════════════════════════════════════════
function addLog(cat){
    if(!cars[activeIdx]){toast('اختر مركبة أولاً');return;}
    const isFuel=cat==='وقود';
    const priceRaw=isFuel?document.getElementById('f_p').value:document.getElementById('m_p').value;
    const price=parseFloat(priceRaw);
    if(!priceRaw||isNaN(price)||price<0){toast('أدخل مبلغاً صحيحاً');return;}
    let title=isFuel?'تعبئة وقود':document.getElementById('m_type_sel').value;
    if(title==='أخرى') title=document.getElementById('m_t_manual').value||'صيانة أخرى';
    const date=isFuel?document.getElementById('f_d').value:document.getElementById('m_d').value;
    const btnId=isFuel?'fuel-btn':'maint-btn';
    const btnHtml=isFuel?'<i data-lucide="fuel" width="16" height="16"></i> تسجيل الوقود':'<i data-lucide="wrench" width="16" height="16"></i> تسجيل الصيانة';
    const btn=document.getElementById(btnId);
    if(btn){btn.disabled=true;btn.innerHTML='<div class="btn-spinner"></div> جاري الحفظ...';}
    db.ref(`users/${userId}/garage/${cars[activeIdx].id}/logs`)
        .push({cat,price,title,date})
        .then(()=>{toast('تم التسجيل ✓');currentFilter='الكل';showTab('p5');})
        .catch(()=>{resetBtn(btnId,btnHtml);toast('حدث خطأ');initIcons();}); // FIX #3
}
 
// ══════════════════════════════════════════
// ODO — FIX #5 + FIX #10
// ══════════════════════════════════════════
function updateOdo(currentOdo){
    const raw=document.getElementById('odo_val').value;
    // FIX #10: نقبل الصفر وأي رقم صحيح
    if(raw===''||raw===null){toast('أدخل قراءة العداد');return;}
    const v=parseInt(raw);
    if(isNaN(v)||v<0){toast('أدخل رقماً صحيحاً');return;}
    if(!cars[activeIdx])return;
    const btn=document.getElementById('odo-btn');
    if(btn){btn.disabled=true;btn.innerHTML='<div class="btn-spinner"></div> جاري التحديث...';}
    db.ref(`users/${userId}/garage/${cars[activeIdx].id}`)
        .update({lastOdo:v+' كم'})
        .then(()=>toast('تم التحديث ✓'))
        .catch(()=>{resetBtn('odo-btn','<i data-lucide="gauge" width="16" height="16"></i> تحديث العداد');toast('حدث خطأ');initIcons();}); // FIX #3
}
 
// ══════════════════════════════════════════
// EXPORT — FIX #9
// ══════════════════════════════════════════
function exportExcel(){
    const car=cars[activeIdx];
    if(!car?.logs){toast('لا توجد بيانات للتصدير');return;}
    const arr=Object.values(car.logs);
    const filtered=currentFilter==='الكل'?arr:arr.filter(l=>l.title.includes(currentFilter)||l.cat.includes(currentFilter));
    // FIX #9: تحقق من الفلتر الفارغ
    if(filtered.length===0){toast('لا توجد سجلات في هذا الفلتر');return;}
    const total=filtered.reduce((a,b)=>a+Number(b.price),0);
    const data=filtered.map(l=>({'التاريخ':l.date,'النوع':l.cat,'التفاصيل':l.title,'المبلغ':Number(l.price)}));
    data.push({'التاريخ':'','النوع':'','التفاصيل':'الإجمالي','المبلغ':total});
    // شيت ثانٍ للمخالفات والتأمين
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.json_to_sheet(data);
    XLSX.utils.book_append_sheet(wb,'السجل',ws); // ← اسم عربي أنظف
 
    if(car.fines){
        const fd=Object.values(car.fines).map(f=>({'التاريخ':f.date,'النوع المخالفة':f.fineType,'المبلغ':Number(f.price),'الحالة':f.status}));
        XLSX.utils.book_append_sheet(wb,'المخالفات',XLSX.utils.json_to_sheet(fd));
    }
    if(car.insurance){
        const id=Object.values(car.insurance).map(i=>({'نوع التأمين':i.insType,'الشركة':i.company||'—','القسط':Number(i.price),'بداية':i.startDate,'نهاية':i.endDate}));
        XLSX.utils.book_append_sheet(wb,'التأمين',XLSX.utils.json_to_sheet(id));
    }
    XLSX.writeFile(wb,`سجل_${car.type}.xlsx`);
    toast('تم التصدير ✓');
}
 
// ══════════════════════════════════════════
// MISC
// ══════════════════════════════════════════
function toggleInstalments(){
    const v=document.getElementById('ins_pay_method')?.value;
    const g=document.getElementById('ins_install_group');
    if(g) g.classList.toggle('hidden',v!=='أقساط');
}
 
function toggleManualMaint(){
    document.getElementById('manual_m_group').classList.toggle('hidden',document.getElementById('m_type_sel').value!=='أخرى');
}
</script>
