<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة سياراتي - النسخة الكاملة</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #fbbf24; --bg-site: #0b0f1a; --card-bg: #161b2a; --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { margin: 0; background-color: var(--bg-site); color: var(--text-main); direction: rtl; }
        
        .top-nav { display: flex; background: #111827; border-bottom: 2px solid var(--primary); sticky; top: 0; z-index: 1000; justify-content: space-around; overflow-x: auto; }
        .nav-item { padding: 18px 10px; cursor: pointer; font-size: 14px; color: var(--text-muted); white-space: nowrap; transition: 0.3s; }
        .nav-item.active { color: var(--primary); font-weight: bold; border-bottom: 3px solid var(--primary); }

        .main-content { padding: 20px; max-width: 600px; margin: 0 auto; }
        .form-container { background: var(--card-bg); padding: 30px; border-radius: 24px; border: 1px solid #2d3748; }
        
        h3 { color: var(--primary); text-align: center; margin-top: 0; margin-bottom: 25px; font-size: 22px; }
        
        .tip-box { background: rgba(251, 191, 36, 0.1); border: 1px solid var(--primary); padding: 15px; border-radius: 12px; margin-bottom: 25px; text-align: center; font-size: 14px; color: var(--primary); }
        
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
        label { font-size: 14px; color: var(--primary); font-weight: 600; }
        input, select { padding: 14px; border: 1px solid #334155; border-radius: 12px; background: #0f172a; color: white; font-size: 16px; outline: none; }
        input::placeholder { color: #4b5563; }
        
        .btn-save { padding: 16px; border: none; border-radius: 15px; font-weight: 700; cursor: pointer; width: 100%; background: var(--primary); color: #0b0f1a; font-size: 18px; transition: 0.2s; }
        .btn-save:active { transform: scale(0.98); }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .stat-card { background: #1a202e; border-radius: 20px; padding: 20px; display: flex; align-items: center; justify-content: space-between; border: 1px solid #2d3748; }
        .stat-card.maint { border-right: 4px solid #f87171; }
        .stat-card.fuel { border-right: 4px solid #34d399; }
        .stat-card.odo { border-right: 4px solid #818cf8; }
        .stat-card.cost { border-right: 4px solid #fbbf24; }
        
        .stat-info div { color: var(--text-muted); font-size: 13px; }
        .stat-value { font-size: 18px; font-weight: 700; color: white; }
    </style>
</head>
<body>

<nav class="top-nav">
    <div class="nav-item active" onclick="showTab('p1', this)">🚗 المركبة</div>
    <div class="nav-item" onclick="showTab('p2', this)">🔧 صيانة</div>
    <div class="nav-item" onclick="showTab('p6', this)">⛽ الوقود</div>
    <div class="nav-item" onclick="showTab('p3', this)">📍 التتبع</div>
    <div class="nav-item" onclick="showTab('p4', this)">📊 إحصائيات</div>
    <div class="nav-item" onclick="showTab('p5', this)">📑 سجل</div>
</nav>

<main class="main-content">
    <div id="content-area" class="form-container">
        <div style="text-align:center">جاري الاتصال بالسحاب...</div>
    </div>
</main>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyC7NtjHZCukPK6o1WUqqyYs8-xpX4ldHNc",
        authDomain: "car-tracker-78f7b.firebaseapp.com",
        databaseURL: "https://car-tracker-78f7b-default-rtdb.firebaseio.com",
        projectId: "car-tracker-78f7b",
        storageBucket: "car-tracker-78f7b.firebasestorage.app",
        messagingSenderId: "7295247933",
        appId: "1:7295247933:web:3e88e9423c39c2edeeac54"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let cars = [];
    let activeIdx = 0;

    db.ref('garage').on('value', (snapshot) => {
        const data = snapshot.val();
        cars = data ? Object.values(data) : [];
        showTab('p1');
    });

    function showTab(tabId, el) {
        if(el) { document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active')); el.classList.add('active'); }
        const area = document.getElementById('content-area');
        let car = cars[activeIdx];

        if(tabId === 'p1') {
            area.innerHTML = `<h3>بيانات المركبة</h3>
                <div class="input-group"><label>اختر المركبة</label>
                <select onchange="activeIdx=this.value; showTab('p1')">${cars.map((c,i)=>`<option value="${i}" ${i==activeIdx?'selected':''}>${c.type}</option>`).join('')}<option value="new">+ إضافة جديدة</option></select></div>
                <div class="input-group"><label>نوع المركبة</label><input type="text" id="v_type" value="${car?car.type:''}" placeholder="مثال: تويوتا كامري"></div>
                <button class="btn-save" onclick="saveCar()">حفظ 💾</button>`;
        }
        else if(tabId === 'p3') {
            area.innerHTML = `<h3>تحديث الممشى</h3>
                <div class="tip-box">💡 يفضل تسجيل الممشى أول 5 أيام من الشهر لدقة الإحصائيات.</div>
                <div class="input-group"><label>الممشى الحالي (كم)</label><input type="number" id="odo_val" placeholder="مثال: 50200"></div>
                <button class="btn-save" onclick="updateOdo()">تحديث القراءة 📍</button>`;
        }
        else if(tabId === 'p4') {
            if(!car) { area.innerHTML = "<h3>أضف مركبة أولاً</h3>"; return; }
            const logs = car.logs ? Object.values(car.logs) : [];
            const mCost = logs.filter(l=>l.cat==='صيانة').reduce((a,b)=>a+Number(b.price||0),0);
            area.innerHTML = `<h3>الإحصائيات</h3>
                <div class="stats-grid">
                    <div class="stat-card maint"><div class="stat-info"><div>صيانات</div><div class="stat-value">${logs.filter(l=>l.cat==='صيانة').length}</div></div></div>
                    <div class="stat-card cost"><div class="stat-info"><div>تكاليف</div><div class="stat-value">${mCost} ر</div></div></div>
                    <div class="stat-card fuel"><div class="stat-info"><div>تعبئات</div><div class="stat-value">${logs.filter(l=>l.cat==='وقود').length}</div></div></div>
                    <div class="stat-card odo"><div class="stat-info"><div>الممشى</div><div class="stat-value">${car.lastOdo||'0 كم'}</div></div></div>
                </div>`;
        }
        // ... باقي الوظائف (صيانة، وقود، سجل) بتصميمها الأصلي
        else if(tabId === 'p2') {
            area.innerHTML = `<h3>تسجيل صيانة</h3>
                <div class="input-group"><label>نوع الصيانة</label><input type="text" id="m_t" placeholder="تغيير زيت، فلاتر..."></div>
                <div class="input-group"><label>المبلغ</label><input type="number" id="m_p" placeholder="0.00"></div>
                <button class="btn-save" onclick="addLog('صيانة')">حفظ 🔧</button>`;
        }
        else if(tabId === 'p6') {
            area.innerHTML = `<h3>تسجيل وقود</h3>
                <div class="input-group"><label>المبلغ</label><input type="number" id="f_p" placeholder="0.00"></div>
                <button class="btn-save" onclick="addLog('وقود')">حفظ ⛽</button>`;
        }
        else if(tabId === 'p5') {
            const logs = car && car.logs ? Object.values(car.logs).reverse() : [];
            area.innerHTML = `<h3>سجل العمليات</h3>` + logs.map(l=>`<div style="background:#0f172a; padding:12px; border-radius:10px; margin-bottom:8px; border-right:4px solid ${l.cat==='وقود'?'#34d399':'#f87171'}"><b>${l.title}</b><br><small>${l.price} ر | ${l.date}</small></div>`).join('');
        }
    }

    function saveCar() {
        const type = document.getElementById('v_type').value;
        const id = cars[activeIdx] ? cars[activeIdx].id : db.ref('garage').push().key;
        db.ref('garage/'+id).update({id, type}).then(()=>alert("تم الحفظ"));
    }
    function updateOdo() {
        const v = document.getElementById('odo_val').value;
        if(v) db.ref('garage/'+cars[activeIdx].id+'/lastOdo').set(v + " كم").then(()=>alert("تم التحديث"));
    }
    function addLog(cat) {
        const price = document.getElementById(cat==='وقود'?'f_p':'m_p').value;
        const title = cat==='وقود'?"تعبئة وقود":document.getElementById('m_t').value;
        db.ref('garage/'+cars[activeIdx].id+'/logs').push({cat, price, title, date: new Date().toLocaleDateString('en-GB')}).then(()=>alert("تم التسجيل"));
    }
</script>
</body>
</html>
