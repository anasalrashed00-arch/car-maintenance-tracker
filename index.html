<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مركبتي السحابية</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #6ee7f7;
            --accent2: #a78bfa;
            --accent3: #f472b6;
            --gold: #fbbf24;
            --bg1: #060b18;
            --bg2: #0b1222;
            --glass: rgba(255,255,255,0.04);
            --glass-border: rgba(255,255,255,0.09);
            --glass-hover: rgba(255,255,255,0.07);
            --glass-strong: rgba(255,255,255,0.08);
            --text: #e8eeff;
            --text2: #8899bb;
            --text3: #5a6a8a;
            --danger: #f87171;
            --danger-glass: rgba(248,113,113,0.1);
            --success: #34d399;
            --success-glass: rgba(52,211,153,0.1);
            --warn: #fbbf24;
            --warn-glass: rgba(251,191,36,0.1);
            --purple-glass: rgba(167,139,250,0.1);
            --nav-h: 72px;
            --r: 18px;
            --r-sm: 12px;
        }
 
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; }
        input[type=number] { -moz-appearance: textfield; }
 
        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg1);
            color: var(--text);
            direction: rtl;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: var(--nav-h);
        }
 
        /* ─── AMBIENT GLOW BACKGROUND ─── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse 70% 50% at 20% 10%, rgba(110,231,247,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 80%, rgba(167,139,250,0.07) 0%, transparent 60%),
                radial-gradient(ellipse 50% 50% at 50% 50%, rgba(244,114,182,0.04) 0%, transparent 70%);
            pointer-events: none;
        }
 
        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
        }
 
        /* ─── SPLASH ─── */
        #splash {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg1);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 24px;
            transition: opacity .5s ease;
        }
        #splash.hide { opacity: 0; pointer-events: none; }
 
        .splash-orb {
            width: 96px; height: 96px;
            border-radius: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            display: flex; align-items: center; justify-content: center;
            position: relative;
            animation: splashFloat 3s ease-in-out infinite;
        }
        .splash-orb::before {
            content: '';
            position: absolute; inset: -1px;
            border-radius: 29px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            z-index: -1;
            opacity: 0.4;
            filter: blur(12px);
            animation: splashPulse 3s ease-in-out infinite;
        }
        .splash-orb svg { width: 44px; height: 44px; color: #000; }
 
        @keyframes splashFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @keyframes splashPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }
 
        .splash-title {
            font-size: 26px; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }
        .splash-sub { font-size: 13px; color: var(--text3); }
        .splash-dots { display: flex; gap: 6px; }
        .splash-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--text3);
            animation: dotPulse 1.4s ease-in-out infinite;
        }
        .splash-dot:nth-child(2) { animation-delay: .2s; }
        .splash-dot:nth-child(3) { animation-delay: .4s; }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.4); background: var(--accent); }
        }
 
        /* ─── AUTH ─── */
        #auth-area {
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; padding: 24px;
            position: relative; z-index: 1;
        }
 
        .auth-card {
            background: var(--glass-strong);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 48px 36px;
            width: 100%; max-width: 400px;
            text-align: center;
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            position: relative;
            overflow: hidden;
        }
        .auth-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(110,231,247,0.5), transparent);
        }
 
        .auth-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 24px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 24px;
            position: relative;
        }
        .auth-icon::after {
            content: '';
            position: absolute; inset: -2px;
            border-radius: 26px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            z-index: -1; opacity: 0.3; filter: blur(8px);
        }
        .auth-icon svg { width: 38px; height: 38px; color: #000; }
        .auth-title { font-size: 24px; font-weight: 900; color: var(--text); margin-bottom: 6px; }
        .auth-sub { font-size: 13px; color: var(--text2); margin-bottom: 36px; }
 
        /* ─── HEADER ─── */
        .header-bar {
            background: rgba(6,11,24,0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 16px;
            height: 60px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 200;
            gap: 12px;
        }
        .header-bar::after {
            content: '';
            position: absolute; bottom: 0; left: 10%; right: 10%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(110,231,247,0.2), transparent);
        }
 
        .header-brand { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
        .header-logo {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .header-logo svg { width: 18px; height: 18px; color: #000; }
        .header-name {
            font-size: 16px; font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
 
        .header-car-switch { flex: 1; display: flex; align-items: center; justify-content: center; }
        .car-switch-btn {
            display: flex; align-items: center; gap: 8px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 7px 14px;
            cursor: pointer;
            transition: all .2s;
            max-width: 200px;
        }
        .car-switch-btn:hover { background: var(--glass-hover); border-color: rgba(110,231,247,0.25); }
        .car-switch-name { font-size: 12px; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 120px; }
        .car-switch-btn svg { color: var(--accent); flex-shrink: 0; width: 14px; height: 14px; }
 
        .logout-btn {
            background: var(--danger-glass);
            color: var(--danger);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: 10px;
            padding: 7px 12px;
            font-size: 12px; font-weight: 700;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            display: flex; align-items: center; gap: 5px;
            flex-shrink: 0;
            transition: all .2s;
        }
        .logout-btn:hover { background: rgba(248,113,113,0.18); }
        .logout-btn svg { width: 13px; height: 13px; }
 
        /* ─── SESSION BANNER ─── */
        .session-banner {
            background: var(--warn-glass);
            border-bottom: 1px solid rgba(251,191,36,0.15);
            padding: 8px 16px;
            font-size: 12px; font-weight: 700;
            color: var(--warn);
            text-align: center;
            display: none; align-items: center; justify-content: center; gap: 8px;
        }
 
        /* ─── BOTTOM NAV ─── */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            height: var(--nav-h);
            background: rgba(6,11,24,0.92);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border-top: 1px solid var(--glass-border);
            display: none;
            align-items: center; justify-content: space-around;
            padding: 0 8px;
            z-index: 200;
        }
        .bottom-nav::before {
            content: '';
            position: absolute; top: 0; left: 15%; right: 15%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(110,231,247,0.15), transparent);
        }
 
        .nav-item {
            display: flex; flex-direction: column; align-items: center;
            padding: 8px 12px;
            border-radius: 16px;
            cursor: pointer;
            color: var(--text3);
            font-size: 10px; font-weight: 700;
            min-width: 58px;
            transition: all .25s;
            white-space: nowrap;
            flex-shrink: 0;
            gap: 4px;
            position: relative;
        }
        .nav-item svg { width: 22px; height: 22px; transition: all .25s; }
        .nav-item.active { color: var(--accent); }
        .nav-item.active svg { filter: drop-shadow(0 0 6px var(--accent)); }
        .nav-item.active::before {
            content: '';
            position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 28px; height: 2px;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            border-radius: 0 0 4px 4px;
        }
        .nav-item:not(.active):hover { color: var(--text2); }
 
        /* ─── MAIN ─── */
        #app-area { position: relative; z-index: 1; }
        .main-content { padding: 16px; max-width: 560px; margin: 0 auto; }
 
        /* ─── GLASS CARD ─── */
        .g-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r);
            padding: 22px 18px;
            margin-bottom: 14px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }
        .g-card::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }
 
        .section-title {
            font-size: 15px; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 18px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--glass-border);
            color: var(--text);
        }
        .section-title svg { color: var(--accent); width: 18px; height: 18px; }
 
        /* ─── INPUTS ─── */
        .input-group { margin-bottom: 14px; }
        label { display: block; font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 7px; letter-spacing: .3px; }
 
        input, select {
            width: 100%; height: 50px;
            padding: 0 16px;
            border: 1px solid var(--glass-border);
            border-radius: var(--r-sm);
            background: var(--glass);
            color: var(--text);
            font-size: 14px;
            font-family: 'Tajawal', sans-serif;
            outline: none;
            appearance: none; -webkit-appearance: none;
            transition: all .2s;
            backdrop-filter: blur(8px);
        }
        input:focus, select:focus {
            border-color: rgba(110,231,247,0.4);
            background: rgba(110,231,247,0.05);
            box-shadow: 0 0 0 3px rgba(110,231,247,0.08);
        }
        input::placeholder { color: var(--text3); }
        select option { background: #0e1829; color: var(--text); }
 
        .select-wrap { position: relative; }
        .select-wrap::after {
            content: '▾'; font-size: 13px; color: var(--accent);
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            pointer-events: none;
        }
 
        /* ─── BUTTONS ─── */
        .btn {
            width: 100%; height: 50px;
            border: none; border-radius: var(--r-sm);
            font-family: 'Tajawal', sans-serif;
            font-size: 15px; font-weight: 800;
            cursor: pointer;
            transition: all .2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            position: relative; overflow: hidden;
        }
        .btn::after {
            content: '';
            position: absolute; inset: 0;
            background: rgba(255,255,255,0);
            transition: background .2s;
        }
        .btn:hover::after { background: rgba(255,255,255,0.06); }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn:disabled::after { display: none; }
 
        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #060b18;
            box-shadow: 0 4px 24px rgba(110,231,247,0.2);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(110,231,247,0.3);
        }
        .btn-primary:active:not(:disabled) { transform: translateY(0); }
        .btn-primary svg { width: 16px; height: 16px; }
 
        .btn-ghost {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            color: var(--text2);
        }
        .btn-ghost:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
 
        .btn-danger {
            background: var(--danger-glass);
            border: 1px solid rgba(248,113,113,0.2);
            color: var(--danger);
        }
        .btn-danger:hover { background: rgba(248,113,113,0.18); }
 
        .btn-success-outline {
            background: var(--success-glass);
            border: 1px solid rgba(52,211,153,0.2);
            color: var(--success);
            margin-bottom: 14px;
        }
        .btn-success-outline:hover { background: rgba(52,211,153,0.18); }
 
        .btn-fine {
            background: var(--danger-glass);
            border: 1px solid rgba(248,113,113,0.2);
            color: var(--danger);
        }
        .btn-fine:hover { background: rgba(248,113,113,0.18); }
 
        .btn-ins {
            background: var(--purple-glass);
            border: 1px solid rgba(167,139,250,0.2);
            color: var(--accent2);
        }
        .btn-ins:hover { background: rgba(167,139,250,0.18); }
 
        .btn-sm { height: 38px; font-size: 13px; border-radius: var(--r-sm); }
        .btn-spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(0,0,0,0.25);
            border-top-color: #060b18;
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        .btn-spinner-light {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.15);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
 
        /* ─── STATS ─── */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
 
        .stat-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r);
            padding: 18px 14px;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all .2s;
        }
        .stat-card:hover { border-color: rgba(110,231,247,0.2); }
        .stat-icon { margin-bottom: 8px; display: flex; justify-content: center; }
        .stat-icon svg { width: 22px; height: 22px; color: var(--accent); }
        .stat-label { font-size: 11px; color: var(--text2); font-weight: 600; margin-bottom: 6px; display: block; }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--accent); display: block; }
        .stat-unit { font-size: 11px; color: var(--text3); }
        .stat-card.total { grid-column: span 2; }
        .stat-card.total .stat-value { font-size: 28px; }
 
        /* ─── CHART ─── */
        .chart-wrap {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r);
            padding: 20px;
            margin-top: 12px;
        }
        .chart-title { font-size: 12px; font-weight: 700; color: var(--text2); margin-bottom: 16px; }
        .chart-bars { display: flex; align-items: flex-end; gap: 6px; height: 100px; }
        .chart-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .chart-bar { width: 100%; border-radius: 5px 5px 0 0; min-height: 4px; transition: height .5s ease; }
        .chart-bar.fuel-bar { background: linear-gradient(to top, rgba(110,231,247,0.4), rgba(110,231,247,0.8)); }
        .chart-bar.maint-bar { background: linear-gradient(to top, rgba(167,139,250,0.4), rgba(167,139,250,0.8)); }
        .chart-label { font-size: 9px; color: var(--text3); font-weight: 600; }
        .chart-legend { display: flex; gap: 16px; margin-top: 12px; justify-content: center; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text2); font-weight: 600; }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; }
 
        /* ─── LOG ITEMS ─── */
        .log-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-sm);
            padding: 12px 14px;
            margin-bottom: 8px;
            display: flex; align-items: center; gap: 10px;
            transition: all .2s;
        }
        .log-item:hover { border-color: rgba(110,231,247,0.18); background: var(--glass-hover); }
 
        .log-dot {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .log-dot.fuel { background: rgba(110,231,247,0.1); }
        .log-dot.fuel svg { color: var(--accent); }
        .log-dot.maint { background: rgba(167,139,250,0.1); }
        .log-dot.maint svg { color: var(--accent2); }
        .log-dot.fine { background: var(--danger-glass); }
        .log-dot.fine svg { color: var(--danger); }
        .log-dot.ins { background: var(--purple-glass); }
        .log-dot.ins svg { color: var(--accent2); }
        .log-dot svg { width: 18px; height: 18px; }
 
        .log-info { flex: 1; min-width: 0; }
        .log-title { font-size: 14px; font-weight: 700; color: var(--text); }
        .log-meta { font-size: 11px; color: var(--text2); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
 
        .log-price {
            background: rgba(110,231,247,0.08);
            border: 1px solid rgba(110,231,247,0.18);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 13px; font-weight: 800;
            flex-shrink: 0; white-space: nowrap;
        }
 
        .log-del, .log-edit {
            color: var(--text3);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
            transition: all .2s;
            flex-shrink: 0;
            display: flex; align-items: center;
        }
        .log-del svg, .log-edit svg { width: 15px; height: 15px; }
        .log-del:hover { color: var(--danger); background: var(--danger-glass); }
        .log-edit:hover { color: var(--accent); background: rgba(110,231,247,0.08); }
 
        /* ─── STATUS BADGE ─── */
        .status-badge {
            padding: 3px 10px;
            border-radius: 100px;
            font-size: 11px; font-weight: 800;
            flex-shrink: 0; white-space: nowrap;
        }
        .status-paid { background: var(--success-glass); color: var(--success); border: 1px solid rgba(52,211,153,0.2); }
        .status-pending { background: var(--danger-glass); color: var(--danger); border: 1px solid rgba(248,113,113,0.2); }
        .status-active { background: var(--success-glass); color: var(--success); border: 1px solid rgba(52,211,153,0.2); }
        .status-expiring { background: var(--warn-glass); color: var(--warn); border: 1px solid rgba(251,191,36,0.2); }
        .status-expired { background: var(--danger-glass); color: var(--danger); border: 1px solid rgba(248,113,113,0.2); }
 
        /* ─── LOG TOTAL ─── */
        .log-total {
            background: rgba(110,231,247,0.06);
            border: 1px solid rgba(110,231,247,0.15);
            border-radius: var(--r-sm);
            padding: 14px 16px;
            display: flex; align-items: center; justify-content: space-between;
            margin-top: 6px;
        }
        .log-total-label { font-size: 13px; font-weight: 700; color: var(--text2); }
        .log-total-value { font-size: 18px; font-weight: 900; color: var(--accent); }
 
        /* ─── INSURANCE CARD ─── */
        .ins-card {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r);
            padding: 18px 16px;
            margin-bottom: 12px;
            transition: all .2s;
        }
        .ins-card:hover { border-color: rgba(167,139,250,0.2); }
        .ins-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
        .ins-avatar {
            width: 46px; height: 46px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
            background: var(--purple-glass);
        }
        .ins-avatar svg { width: 22px; height: 22px; color: var(--accent2); }
        .ins-title { font-size: 15px; font-weight: 800; color: var(--text); }
        .ins-type { font-size: 12px; color: var(--text2); margin-top: 2px; }
        .ins-dates { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .ins-date-item {
            background: var(--glass);
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid var(--glass-border);
        }
        .ins-date-label { font-size: 10px; color: var(--text3); font-weight: 600; margin-bottom: 3px; }
        .ins-date-val { font-size: 13px; font-weight: 800; color: var(--text); }
        .ins-progress { margin-top: 14px; }
        .ins-progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text2); margin-bottom: 6px; }
        .ins-progress-bar { height: 5px; background: var(--glass-border); border-radius: 3px; overflow: hidden; }
        .ins-progress-fill { height: 100%; border-radius: 3px; transition: width .5s ease; }
 
        /* ─── MODAL ─── */
        .modal-overlay {
            position: fixed; inset: 0; z-index: 500;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: flex-end; justify-content: center;
            animation: fadeIn .2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
 
        .modal-box {
            background: #0b1525;
            border: 1px solid rgba(110,231,247,0.12);
            border-bottom: none;
            border-radius: 28px 28px 0 0;
            padding: 28px 20px 40px;
            width: 100%; max-width: 560px;
            animation: slideUp .3s cubic-bezier(.34,1.2,.64,1);
            max-height: 92vh; overflow-y: auto;
            position: relative;
        }
        .modal-box::before {
            content: '';
            position: absolute; top: 0; left: 20%; right: 20%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(110,231,247,0.4), transparent);
        }
 
        .modal-handle {
            width: 44px; height: 4px;
            background: var(--glass-border);
            border-radius: 4px;
            margin: 0 auto 22px;
        }
        .modal-title { font-size: 17px; font-weight: 900; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .modal-title svg { width: 18px; height: 18px; color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
 
        /* ─── CONFIRM ─── */
        .confirm-overlay {
            position: fixed; inset: 0; z-index: 600;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex; align-items: center; justify-content: center;
            padding: 24px;
            animation: fadeIn .2s ease;
        }
        .confirm-box {
            background: #0b1525;
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px 24px;
            width: 100%; max-width: 320px;
            text-align: center;
            animation: scaleIn .25s cubic-bezier(.34,1.2,.64,1);
        }
        @keyframes scaleIn { from { transform: scale(.88); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .confirm-icon {
            width: 64px; height: 64px;
            background: var(--danger-glass);
            border: 1px solid rgba(248,113,113,0.15);
            border-radius: 20px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 18px;
        }
        .confirm-icon svg { width: 28px; height: 28px; color: var(--danger); }
        .confirm-title { font-size: 17px; font-weight: 900; color: var(--text); margin-bottom: 8px; }
        .confirm-sub { font-size: 13px; color: var(--text2); margin-bottom: 24px; line-height: 1.7; }
        .confirm-actions { display: flex; gap: 10px; }
 
        /* ─── CAR SWITCH MODAL ─── */
        .car-list-item {
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-sm);
            padding: 14px 16px;
            margin-bottom: 8px;
            display: flex; align-items: center; gap: 12px;
            cursor: pointer;
            transition: all .2s;
        }
        .car-list-item:hover { border-color: rgba(110,231,247,0.2); background: var(--glass-hover); }
        .car-list-item.selected { border-color: rgba(110,231,247,0.4); background: rgba(110,231,247,0.06); }
        .car-list-avatar {
            width: 46px; height: 46px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .car-list-avatar svg { width: 22px; height: 22px; color: #000; }
        .car-list-name { font-size: 15px; font-weight: 800; color: var(--text); }
        .car-list-year { font-size: 12px; color: var(--text2); margin-top: 2px; }
 
        /* ─── CAR HEADER ─── */
        .car-header {
            background: rgba(110,231,247,0.04);
            border: 1px solid rgba(110,231,247,0.12);
            border-radius: var(--r);
            padding: 16px 18px;
            margin-bottom: 14px;
            display: flex; align-items: center; gap: 14px;
            position: relative; overflow: hidden;
        }
        .car-header::before {
            content: '';
            position: absolute; top: 0; left: 0; right: 0; height: 1px;
            background: linear-gradient(90deg, transparent, rgba(110,231,247,0.3), transparent);
        }
        .car-avatar {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .car-avatar svg { width: 24px; height: 24px; color: #000; }
        .car-name { font-size: 16px; font-weight: 900; color: var(--text); }
        .car-year { font-size: 12px; color: var(--text2); margin-top: 2px; }
 
        /* ─── FILTER PILLS ─── */
        .filter-pills {
            display: flex; gap: 8px;
            overflow-x: auto; scrollbar-width: none;
            padding-bottom: 2px; margin-bottom: 16px;
        }
        .filter-pills::-webkit-scrollbar { display: none; }
        .pill {
            padding: 7px 16px;
            border-radius: 100px;
            border: 1px solid var(--glass-border);
            background: var(--glass);
            color: var(--text2);
            font-size: 12px; font-weight: 700;
            cursor: pointer; white-space: nowrap;
            transition: all .2s;
            flex-shrink: 0;
            font-family: 'Tajawal', sans-serif;
        }
        .pill.active { background: rgba(110,231,247,0.1); border-color: rgba(110,231,247,0.35); color: var(--accent); }
        .pill.pill-fine.active { background: var(--danger-glass); border-color: rgba(248,113,113,0.3); color: var(--danger); }
        .pill.pill-ins.active { background: var(--purple-glass); border-color: rgba(167,139,250,0.3); color: var(--accent2); }
 
        /* ─── ODO ─── */
        .odo-display {
            background: rgba(110,231,247,0.04);
            border: 1px solid rgba(110,231,247,0.12);
            border-radius: var(--r-sm);
            padding: 20px;
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 16px;
        }
        .odo-icon {
            width: 50px; height: 50px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border-radius: 15px;
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0;
        }
        .odo-icon svg { width: 24px; height: 24px; color: #000; }
        .odo-num { font-size: 32px; font-weight: 900; color: var(--accent); letter-spacing: -1px; line-height: 1; }
        .odo-label { font-size: 11px; color: var(--text2); margin-top: 3px; }
        .odo-warn {
            background: var(--danger-glass);
            border: 1px solid rgba(248,113,113,0.2);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 12px; font-weight: 700;
            color: var(--danger);
            margin-top: 8px;
            display: none; align-items: center; gap: 6px;
        }
        .odo-warn svg { width: 14px; height: 14px; }
 
        /* ─── INNER TABS ─── */
        .inner-tabs {
            display: flex; gap: 0;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: var(--r-sm);
            padding: 4px;
            margin-bottom: 20px;
        }
        .inner-tab {
            flex: 1; height: 40px;
            border: none; border-radius: 9px;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px; font-weight: 800;
            cursor: pointer;
            transition: all .25s;
            background: transparent;
            color: var(--text2);
        }
        .inner-tab.active {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: #060b18;
            box-shadow: 0 2px 12px rgba(110,231,247,0.2);
        }
 
        /* ─── NOTICE ─── */
        .notice {
            border-radius: var(--r-sm);
            padding: 10px 14px;
            font-size: 12px; font-weight: 700;
            margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .notice svg { width: 14px; height: 14px; flex-shrink: 0; }
        .notice-cyan { background: rgba(110,231,247,0.07); border: 1px solid rgba(110,231,247,0.18); color: var(--accent); }
        .notice-danger { background: var(--danger-glass); border: 1px solid rgba(248,113,113,0.2); color: var(--danger); }
        .notice-purple { background: var(--purple-glass); border: 1px solid rgba(167,139,250,0.2); color: var(--accent2); }
 
        /* ─── BADGE ─── */
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .badge-fuel { background: rgba(110,231,247,0.1); color: var(--accent); }
        .badge-maint { background: var(--purple-glass); color: var(--accent2); }
        .badge-fine { background: var(--danger-glass); color: var(--danger); }
        .badge-ins { background: var(--purple-glass); color: var(--accent2); }
 
        /* ─── TOAST ─── */
        #toast {
            position: fixed;
            bottom: calc(var(--nav-h) + 16px);
            left: 50%; transform: translateX(-50%) translateY(80px);
            background: rgba(11,21,37,0.95);
            border: 1px solid rgba(110,231,247,0.25);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 14px; font-weight: 700;
            z-index: 9999;
            pointer-events: none;
            transition: transform .3s cubic-bezier(.34,1.56,.64,1), opacity .3s;
            opacity: 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(110,231,247,0.1);
            white-space: nowrap;
            backdrop-filter: blur(12px);
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
 
        /* ─── EMPTY ─── */
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text2); }
        .empty-state .ei { margin-bottom: 12px; display: flex; justify-content: center; opacity: .3; }
        .empty-state .ei svg { width: 48px; height: 48px; color: var(--text2); }
        .empty-state p { font-size: 14px; margin-bottom: 16px; }
 
        /* ─── MISC ─── */
        .hidden { display: none !important; }
 
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
    </style>
</head>
<body>
 
<!-- ═══ SPLASH ═══ -->
<div id="splash">
    <div class="splash-orb">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/>
            <polyline points="12 17 12 19 17 22 22 19 22 12 17 9 12 12"/>

        </svg>
    </div>
    <div class="splash-title">مركبتي السحابية</div>
    <div class="splash-sub">جاري تحميل بياناتك...</div>
    <div class="splash-dots">
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>
        <div class="splash-dot"></div>

</div>
 
<!-- ═══ AUTH ═══ -->
<div id="auth-area" style="display:none">
    <div class="auth-card">
        <div class="auth-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <div class="auth-title">مركبتي السحابية</div>
        <div class="auth-sub">سجّل دخولك لإدارة مركباتك</div>
        <div class="input-group">
            <label>اسم المستخدم</label>
            <input type="text" id="user_id" placeholder="أدخل اسم المستخدم" autocomplete="username">
        </div>
        <div class="input-group">
            <label>كلمة المرور</label>
            <input type="password" id="user_pass" placeholder="••••••••" autocomplete="current-password"
                   onkeydown="if(event.key==='Enter')handleAuth()">
        </div>
        <button class="btn btn-primary" id="auth-btn" onclick="handleAuth()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
            دخول آمن
        </button>
        <div id="auth-err" style="color:var(--danger);font-size:12px;margin-top:12px;display:none"></div>
    </div>
</div>
 
<!-- ═══ APP ═══ -->
<div id="app-area" style="display:none">
    <div class="session-banner" id="session-banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="session-text"></span>
        <span onclick="renewSession()" style="cursor:pointer;text-decoration:underline;margin-right:8px">تجديد الجلسة</span>
    </div>
 
    <div class="header-bar">
        <div class="header-brand">
            <div class="header-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 17H3a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11a2 2 0 0 1 2 2v3"/>
                    <polyline points="12 17 12 19 17 22 22 19 22 12 17 9 12 12"/>
                    <line x1="17" y1="9" x2="17" y2="22"/><line x1="12" y1="12" x2="22" y2="19"/>
                </svg>
            </div>
            <span class="header-name">مركبتي</span>
        </div>
        <div class="header-car-switch">
            <div class="car-switch-btn" onclick="openCarSwitchModal()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/></svg>
                <span class="car-switch-name" id="header-car-name">—</span>
            </div>
        </div>
        <button class="logout-btn" onclick="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            خروج
        </button>
    </div>
 
    <!-- NAV -->
    <nav class="bottom-nav" id="main-nav">
        <div class="nav-item active" id="nav-p1" onclick="showTab('p1',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
            <span>مركبات</span>
        </div>
        <div class="nav-item" id="nav-p2" onclick="showTab('p2',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
            <span>تسجيل</span>
        </div>
        <div class="nav-item" id="nav-p7" onclick="showTab('p7',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>مصاريف</span>
        </div>
        <div class="nav-item" id="nav-p5" onclick="showTab('p5',this)">

            <span>السجل</span>
        </div>
        <div class="nav-item" id="nav-p4" onclick="showTab('p4',this)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
            <span>إحصائيات</span>

    <main class="main-content" id="content-area"></main>
</div>

<script>

const ICONS = {

function esc(str){ if(str==null)return''; return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function hideSplash(){ const s=document.getElementById('splash'); s.classList.add('hide'); setTimeout(()=>s.style.display='none',500); }
function toast(msg,duration=2500){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),duration); }
function resetBtn(id,html){ const b=document.getElementById(id); if(b){b.disabled=false;b.innerHTML=html;} }
 
// ══════════════════════════════════════════
// SESSION
// ══════════════════════════════════════════
const GRACE_MS=60*1000;
function startSession(){ localStorage.setItem('loginTime',Date.now()); hideBanner(); scheduleSessionCheck(); }
function renewSession(){ startSession(); toast('تم تجديد الجلسة ✓'); }
function hideBanner(){ const b=document.getElementById('session-banner'); if(b) b.style.display='none'; }
function scheduleSessionCheck(){
    clearTimeout(sessionTimer); clearTimeout(sessionWarningTimer);
    const loginTime=parseInt(localStorage.getItem('loginTime')||'0');
    const remaining=SESSION_DURATION-(Date.now()-loginTime);
    if(remaining<=0){auth.signOut();return;}
    const warnAt=remaining-15*60*1000;
    if(warnAt>0){ sessionWarningTimer=setTimeout(()=>{ const b=document.getElementById('session-banner'); const t=document.getElementById('session-text'); if(b&&t){t.textContent='ستنتهي جلستك خلال 15 دقيقة —';b.style.display='flex';} },warnAt); }
    else { const b=document.getElementById('session-banner'); const t=document.getElementById('session-text'); if(b&&t){t.textContent='ستنتهي جلستك قريباً —';b.style.display='flex';} }
    sessionTimer=setTimeout(()=>{auth.signOut();toast('انتهت الجلسة، يرجى تسجيل الدخول مجدداً',4000);},remaining);
}
function isSessionValid(){ const t=parseInt(localStorage.getItem('loginTime')||'0'); return t&&(Date.now()-t)<(SESSION_DURATION+GRACE_MS); }
 
// ══════════════════════════════════════════
// AUTH
// ══════════════════════════════════════════
auth.onAuthStateChanged(user=>{
    if(user){
        const loginTime=parseInt(localStorage.getItem('loginTime')||'0');
        if(loginTime&&!isSessionValid()){auth.signOut();hideSplash();return;}
        userId=user.uid;
        if(loginTime) scheduleSessionCheck();
        setTimeout(()=>{
            hideSplash();
            document.getElementById('auth-area').style.display='none';
            document.getElementById('app-area').style.display='block';
            document.getElementById('main-nav').style.display='flex';
            syncData();
        },1200);
    } else {
        if(dbRef){dbRef.off();dbRef=null;}
        localStorage.removeItem('loginTime');
        clearTimeout(sessionTimer); clearTimeout(sessionWarningTimer);
        setTimeout(()=>{
            hideSplash();
            document.getElementById('auth-area').style.display='flex';
            document.getElementById('app-area').style.display='none';
        },1200);
    }
});
 
function handleAuth(){
    const user=document.getElementById('user_id').value.trim().toLowerCase();
    const pass=document.getElementById('user_pass').value;
    const errEl=document.getElementById('auth-err');
    const btn=document.getElementById('auth-btn');
    errEl.style.display='none';
    if(!user||!pass){errEl.textContent='يرجى إدخال اسم المستخدم وكلمة المرور';errEl.style.display='block';return;}
    if(pass.length<6){errEl.textContent='كلمة المرور يجب أن تكون 6 أحرف على الأقل';errEl.style.display='block';return;}
    btn.disabled=true;
    btn.innerHTML='<div class="btn-spinner"></div> جاري الدخول...';
    const email=user+'@app.com';
    localStorage.setItem('loginTime',Date.now());
    auth.signInWithEmailAndPassword(email,pass)
        .catch(err=>{ if(err.code==='auth/user-not-found') return auth.createUserWithEmailAndPassword(email,pass); throw err; })
        .catch(err=>{
            localStorage.removeItem('loginTime');
            let msg='حدث خطأ، تحقق من البيانات';
            if(err.code==='auth/wrong-password')     msg='كلمة المرور غير صحيحة';
            if(err.code==='auth/invalid-credential') msg='اسم المستخدم أو كلمة المرور غير صحيحة';
            if(err.code==='auth/too-many-requests')  msg='محاولات كثيرة جداً — حاول لاحقاً';
            if(err.code==='auth/weak-password')      msg='كلمة المرور ضعيفة جداً';
            errEl.textContent=msg; errEl.style.display='block';
            btn.disabled=false;
            btn.innerHTML=ic('arrowRt',16)+' دخول آمن';
        });
}
function logout(){ localStorage.removeItem('loginTime'); auth.signOut(); }

function syncData(){
    if(dbRef) dbRef.off();
    dbRef=db.ref('users/'+userId+'/garage');
    dbRef.on('value',snap=>{
        const data=snap.val();
        const newCars=data?Object.keys(data).map(k=>({...data[k],id:k})):[];
        if(cars.length>0&&activeIdx<cars.length&&cars[activeIdx]?.id){
            const curId=cars[activeIdx].id;
            const ni=newCars.findIndex(c=>c.id===curId);
            activeIdx=ni>=0?ni:0;
        } else { activeIdx=Math.min(activeIdx,Math.max(0,newCars.length-1)); }
        isAddingNew=false; cars=newCars;
        updateHeaderCar(); showTab(currentTabId);
    });
}
 
function updateHeaderCar(){
    const el=document.getElementById('header-car-name');
    if(el) el.textContent=cars[activeIdx]?cars[activeIdx].type:'لا توجد مركبة';
}

function renderInsItem(ins){
    const today=new Date(); today.setHours(0,0,0,0);
    const end=ins.endDate?new Date(ins.endDate):null;
    let statusClass='status-active', statusLabel='فعّال';
    if(end){ const diff=Math.ceil((end-today)/(1000*60*60*24)); if(diff<0){statusClass='status-expired';statusLabel='منتهي';}else if(diff<=30){statusClass='status-expiring';statusLabel=`ينتهي بعد ${diff} يوم`;} }
    let progress=100;
    if(ins.startDate&&ins.endDate){ const s=new Date(ins.startDate),e=new Date(ins.endDate); const total=e-s; const elapsed=today-s; progress=total>0?Math.min(100,Math.max(0,Math.round((elapsed/total)*100))):100; }
    const barColor=statusClass==='status-expired'?'var(--danger)':statusClass==='status-expiring'?'var(--warn)':'var(--success)';
    return`<div class="ins-card">

function saveIns(existingKey){
    const car=cars[activeIdx]; if(!car?.id){toast('اختر مركبة أولاً');return;}
    const carId=car.id; const isEdit=existingKey&&existingKey.length>0;
    const insType=document.getElementById('ins_type').value;
    const company=document.getElementById('ins_company').value.trim();
    const priceRaw=document.getElementById('ins_price').value;
    const startDate=document.getElementById('ins_start').value;
    const endDate=document.getElementById('ins_end').value;
    const price=parseFloat(priceRaw);
    if(!priceRaw||isNaN(price)||price<0){toast('أدخل مبلغاً صحيحاً');return;}

    if(endDate<=startDate){toast('تاريخ الانتهاء يجب أن يكون بعد البداية');return;}

    if(payMethod==='أقساط') payload.instalments=instalments;
    ref.set(payload)
        .then(()=>{
            closeExtraModal(); toast(isEdit?'تم التعديل ✓':'تمت إضافة التأمين ✓');

// CHART
// ══════════════════════════════════════════
function buildMonthlyChart(logs){
    if(!logs.length)return{hasData:false};
    const months={},now=new Date();
    for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(),now.getMonth()-i,1); const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; months[k]={label:d.toLocaleDateString('ar-SA',{month:'short'}),fuel:0,maint:0}; }
    logs.forEach(l=>{ if(!l.date)return; const k=l.date.substring(0,7); if(months[k]){ if(l.cat==='وقود')months[k].fuel+=Number(l.price); else months[k].maint+=Number(l.price); } });
    const data=Object.values(months);
    const maxVal=Math.max(...data.map(d=>Math.max(d.fuel,d.maint)),1);
    return{data,maxVal,hasData:data.some(d=>d.fuel>0||d.maint>0)};
}
function renderChart({data,maxVal}){
    const bars=data.map(d=>{ const fh=Math.max((d.fuel/maxVal)*80,d.fuel>0?4:0); const mh=Math.max((d.maint/maxVal)*80,d.maint>0?4:0); return`<div class="chart-bar-wrap"><div style="display:flex;gap:2px;align-items:flex-end;height:80px"><div class="chart-bar fuel-bar" style="height:${fh}px;flex:1"></div><div class="chart-bar maint-bar" style="height:${mh}px;flex:1"></div></div><div class="chart-label">${d.label}</div></div>`; }).join('');
    return`<div class="chart-wrap"><div class="chart-title">المصروفات الشهرية (آخر 6 أشهر)</div><div class="chart-bars">${bars}</div><div class="chart-legend"><div class="legend-item"><div class="legend-dot" style="background:rgba(110,231,247,0.7)"></div>وقود</div><div class="legend-item"><div class="legend-dot" style="background:rgba(167,139,250,0.7)"></div>صيانة</div></div></div>`;
}

    const arr=Object.keys(car.logs).map(k=>({...car.logs[k],key:k}));
    const filtered=currentFilter==='الكل'?arr:arr.filter(l=>l.title.includes(currentFilter)||l.cat.includes(currentFilter));
    if(filtered.length===0){ container.innerHTML=`<div class="empty-state"><div class="ei">${ic('search',48)}</div><p>لا توجد نتائج</p></div>`; return; }
    const total=filtered.reduce((a,b)=>a+Number(b.price),0);
    container.innerHTML=filtered.slice().reverse().map(l=>{ const isFuel=l.cat==='وقود'; return`<div class="log-item"><div class="log-dot ${isFuel?'fuel':'maint'}">${ic(isFuel?'fuel':'wrench',18)}</div><div class="log-info"><div class="log-title">${esc(l.title)}</div><div class="log-meta">${esc(l.date)} · <span class="badge ${isFuel?'badge-fuel':'badge-maint'}">${l.cat}</span></div></div><div class="log-price">${Number(l.price).toLocaleString()} ر.س</div><div class="log-edit" onclick="openEditModal('${l.key}')">${ic('pencil',15)}</div><div class="log-del" onclick="confirmDeleteLog('${l.key}')">${ic('trash',15)}</div></div>`; }).join('')+`<div class="log-total"><span class="log-total-label">الإجمالي (${filtered.length} عملية)</span><span class="log-total-value">${total.toLocaleString()} ر.س</span></div>`;
}
 
// ══════════════════════════════════════════
// CONFIRM
// ══════════════════════════════════════════
let _confirmCb=null;
function showConfirm(title,sub,onConfirm){
    const modal=document.getElementById('confirm-modal');
    Object.assign(modal.style,{display:'flex',position:'fixed',inset:'0',zIndex:'600',alignItems:'center',justifyContent:'center',padding:'24px',background:'rgba(0,0,0,0.75)',backdropFilter:'blur(12px)'});
    modal.innerHTML=`<div class="confirm-box"><div class="confirm-icon">${ic('trash',28)}</div><div class="confirm-title">${esc(title)}</div><div class="confirm-sub">${esc(sub)}</div><div class="confirm-actions"><button class="btn btn-ghost" style="flex:1" onclick="closeConfirm()">إلغاء</button><button class="btn btn-danger" style="flex:1" onclick="confirmAction()">${ic('trash',14)} حذف</button></div></div>`;
    _confirmCb=onConfirm;
    modal.onclick=e=>{if(e.target===modal)closeConfirm();};
}
function confirmAction(){ closeConfirm(); if(_confirmCb)_confirmCb(); }
function closeConfirm(){ const m=document.getElementById('confirm-modal'); m.style.display='none'; m.innerHTML=''; _confirmCb=null; }
 
// ══════════════════════════════════════════
// DELETE LOG
// ══════════════════════════════════════════
function confirmDeleteLog(key){
    const car=cars[activeIdx]; if(!car?.id)return; const carId=car.id;
    showConfirm('حذف العملية','هل أنت متأكد من حذف هذه العملية؟ لا يمكن التراجع.',()=>{
        db.ref(`users/${userId}/garage/${carId}/logs/${key}`).remove()
            .then(()=>{ toast('تم الحذف ✓'); const updatedCar=cars.find(c=>c.id===carId); if(updatedCar?.logs) delete updatedCar.logs[key]; renderLogs(); })
            .catch(()=>toast('فشل الحذف — تحقق من الاتصال'));
    });
}
 
// ══════════════════════════════════════════
// EDIT MODAL
// ══════════════════════════════════════════
function openEditModal(key){
    const car=cars[activeIdx]; if(!car?.logs?.[key])return; const l=car.logs[key];
    const modal=document.getElementById('edit-modal');
    Object.assign(modal.style,{display:'flex',position:'fixed',inset:'0',zIndex:'500',alignItems:'flex-end',justifyContent:'center',background:'rgba(0,0,0,0.7)',backdropFilter:'blur(8px)'});
    modal.innerHTML=`<div class="modal-box"><div class="modal-handle"></div><div class="modal-title">${ic('pencil',18)} تعديل العملية</div><div class="input-group"><label>التفاصيل</label><input type="text" id="edit_title" value="${esc(l.title)}"></div><div class="input-group"><label>المبلغ (ر.س)</label><input type="number" id="edit_price" value="${esc(String(l.price))}" min="0"></div><div class="input-group"><label>التاريخ</label><input type="date" id="edit_date" value="${esc(l.date)}"></div><div class="modal-actions"><button class="btn btn-ghost" style="flex:1" onclick="closeEditModal()">إلغاء</button><button class="btn btn-primary" style="flex:2" id="save-edit-btn" onclick="saveEdit('${key}')">${ic('check',16)} حفظ التعديلات</button></div></div>`;
    modal.onclick=e=>{if(e.target===modal)closeEditModal();};
}
function closeEditModal(){ const m=document.getElementById('edit-modal'); m.style.display='none'; m.innerHTML=''; }
 
function saveEdit(key){
    const car=cars[activeIdx]; if(!car?.id){toast('خطأ: لا توجد مركبة');return;} const carId=car.id;
    const title=document.getElementById('edit_title').value.trim();
    const price=document.getElementById('edit_price').value;
    const date=document.getElementById('edit_date').value;
    if(!title){toast('أدخل التفاصيل');return;}
    const p=parseFloat(price); if(isNaN(p)||p<0){toast('أدخل مبلغاً صحيحاً');return;}
    if(!date){toast('اختر التاريخ');return;}
    const btn=document.getElementById('save-edit-btn'); btn.disabled=true; btn.innerHTML='<div class="btn-spinner"></div>';
    db.ref(`users/${userId}/garage/${carId}/logs/${key}`).update({title,price:p,date})
        .then(()=>{closeEditModal();toast('تم التعديل ✓');renderLogs();})
        .catch(()=>{resetBtn('save-edit-btn',ic('check',16)+' حفظ التعديلات');toast('حدث خطأ');});
}
 
// ══════════════════════════════════════════
// CAR CRUD
// ══════════════════════════════════════════
function startAddNewCar(){ isAddingNew=true; showTab('p1'); }
function cancelAddCar()  { isAddingNew=false; showTab('p1'); }
 
function saveCar(){
    const type=document.getElementById('v_type').value.trim();
    if(!type){toast('أدخل اسم المركبة');return;}
    const btn=document.getElementById('save-car-btn'); btn.disabled=true; btn.innerHTML='<div class="btn-spinner"></div> جاري الحفظ...';
    if(isAddingNew){
        const carId=db.ref('users/'+userId+'/garage').push().key;
        db.ref(`users/${userId}/garage/${carId}`).set({id:carId,type,model:document.getElementById('v_model').value,lastOdo:'0 كم'})
            .then(()=>{isAddingNew=false;toast('تمت إضافة المركبة ✓');})
            .catch(()=>{resetBtn('save-car-btn',ic('check',16)+' حفظ البيانات');toast('حدث خطأ');});
    } else {
        const editCarId=cars[activeIdx]?.id; if(!editCarId){toast('خطأ');return;}
        db.ref(`users/${userId}/garage/${editCarId}`).update({type,model:document.getElementById('v_model').value})
            .then(()=>toast('تم الحفظ ✓'))
            .catch(()=>{resetBtn('save-car-btn',ic('check',16)+' حفظ البيانات');toast('حدث خطأ');});
    }
}
 
function confirmDeleteCar(){
    const car=cars[activeIdx]; if(!car?.id)return; const carId=car.id; const carName=car.type;
    showConfirm('حذف المركبة',`هل أنت متأكد من حذف "${carName}"؟ ستُحذف جميع البيانات نهائياً.`,()=>{
        db.ref(`users/${userId}/garage/${carId}`).remove()
            .then(()=>{activeIdx=0;toast('تم حذف المركبة ✓');})
            .catch(()=>toast('فشل الحذف — تحقق من الاتصال'));
    });
}
 
// ══════════════════════════════════════════
// ADD LOG
// ══════════════════════════════════════════
function addLog(cat){
    if(!cars[activeIdx]){toast('اختر مركبة أولاً');return;}
    const isFuel=cat==='وقود';
    const priceRaw=isFuel?document.getElementById('f_p')?.value:document.getElementById('m_p')?.value;
    const price=parseFloat(priceRaw);
    if(!priceRaw||isNaN(price)||price<0){toast('أدخل مبلغاً صحيحاً');return;}
    let title=isFuel?'تعبئة وقود':document.getElementById('m_type_sel').value;
    if(title==='أخرى') title=document.getElementById('m_t_manual')?.value||'صيانة أخرى';
    const date=isFuel?document.getElementById('f_d')?.value:document.getElementById('m_d')?.value;
    if(!date){toast('اختر التاريخ');return;}
    const btnId=isFuel?'fuel-btn':'maint-btn';
    const btnHtml=isFuel?ic('fuel',16)+' تسجيل الوقود':ic('wrench',16)+' تسجيل الصيانة';
    const btn=document.getElementById(btnId); const carId=cars[activeIdx].id;
    if(btn){btn.disabled=true;btn.innerHTML='<div class="btn-spinner"></div> جاري الحفظ...';}
    db.ref(`users/${userId}/garage/${carId}/logs`).push({cat,price,title,date})
        .then(()=>{toast('تم التسجيل ✓');currentFilter='الكل';showTab('p5');})
        .catch(()=>{resetBtn(btnId,btnHtml);toast('حدث خطأ');});
}
 
// ══════════════════════════════════════════
// EXPORT EXCEL
// ══════════════════════════════════════════
function exportExcel(){
    const car=cars[activeIdx]; if(!car){toast('اختر مركبة أولاً');return;}
    if(!car.logs&&!car.fines&&!car.insurance){toast('لا توجد بيانات للتصدير');return;}
    const wb=XLSX.utils.book_new();
    if(car.logs){ const arr=Object.values(car.logs); const filtered=currentFilter==='الكل'?arr:arr.filter(l=>l.title.includes(currentFilter)||l.cat.includes(currentFilter)); if(filtered.length>0){ const total=filtered.reduce((a,b)=>a+Number(b.price),0); const data=filtered.slice().reverse().map(l=>({'Date':l.date,'Type':l.cat,'Details':l.title,'Amount':Number(l.price)})); data.push({'Date':'','Type':'','Details':'Total','Amount':total}); XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(data),'Log'); } }
    if(car.fines){ const fd=Object.values(car.fines).map(f=>({'Date':f.date,'Fine_Type':f.fineType,'Amount':Number(f.price),'Status':f.status})); if(fd.length>0) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(fd),'Fines'); }
    if(car.insurance){ const wi=Object.values(car.insurance).map(i=>({'Type':i.insType,'Company':i.company||'','Premium':Number(i.price),'Payment':i.payMethod||'','Instalments':i.instalments||'','Start':i.startDate,'End':i.endDate})); if(wi.length>0) XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(wi),'Insurance'); }
    if(wb.SheetNames.length===0){toast('لا توجد بيانات للتصدير');return;}
    const safeName=car.type.replace(/[^a-zA-Z0-9\u0600-\u06FF\s]/g,'').trim()||'car';
    try{ XLSX.writeFile(wb,`record_${safeName}.xlsx`); toast('تم التصدير ✓'); } catch(e){ toast('حدث خطأ في التصدير'); }
}
 
// ══════════════════════════════════════════
// MISC
// ══════════════════════════════════════════
function toggleInstalments(){ const v=document.getElementById('ins_pay_method')?.value; const g=document.getElementById('ins_install_group'); if(g) g.classList.toggle('hidden',v!=='أقساط'); }
function toggleManualMaint(){ document.getElementById('manual_m_group')?.classList.toggle('hidden', document.getElementById('m_type_sel')?.value!=='أخرى'); }
</script>
